// ====================================================================
// EDIT FINISH (modal)
// ====================================================================
function editFinish(cell, sec, id){
  const unit=getUnit(); if(!unit) return;
  const row=unit.items[sec].find(r=>r.id==id); if(!row) return;
  if(row.finish==='(No Finish)'){toast('This item has no finish variants.','warn');return;}
  let opts=[];
  if(sec==='kitchen'){
    const catItems=getPD().kitchen[row.category]||[];
    const descItem=catItems.find(it=>it.desc===row.desc);
    if(descItem) Object.keys(descItem.prices).forEach(k=>{
      const i=k.lastIndexOf('__'); const f=k.slice(0,i); const v=k.slice(i+2);
      if(!opts.find(o=>o.key===k)) opts.push({key:k, label:f+(v&&v!=='standard'?' / '+v:''), price:descItem.prices[k]});
    });
  } else if(sec==='wardrobe'){
    const catItems=getPD().wardrobe[row.category]||[];
    const descItem=catItems.find(it=>it.desc===row.desc);
    if(descItem) Object.keys(descItem.prices).forEach(k=>{
      const finKey=k.replace('__standard','');
      if(!opts.find(o=>o.key===finKey)) opts.push({key:finKey, label:finKey, price:descItem.prices[k]});
    });
  }
  if(!opts.length){toast('No alternative finishes available for this item.','warn');return;}
  const curKey = sec==='kitchen'?(row.finish+'__'+(row.variant||'standard')):row.finish;
  showModal(`<div class="modal-head"><h2>Change Finish</h2><button class="icon-x" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body">
    <p style="font-size:12px;color:var(--ink-faint);margin-bottom:10px">${esc(row.desc)}</p>
    <div class="field"><label>Finish / Handle</label>
      <select class="select" id="ef-sel">
        ${opts.map(o=>`<option value="${escAttr(o.key)}"${o.key===curKey?' selected':''}>${esc(o.label)} — Rp ${fmtNum(o.price)}</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="commitFinish('${sec}','${id}')">Apply</button></div>`);
}

function commitFinish(sec,id){
  const unit=getUnit(); if(!unit) return;
  const row=unit.items[sec].find(r=>r.id==id); if(!row) return;
  const val=el('ef-sel')?.value; if(!val) return;
  if(sec==='kitchen'){
    const i=val.lastIndexOf('__'); const f=val.slice(0,i); const v=val.slice(i+2);
    const catItems=getPD().kitchen[row.category]||[];
    const descItem=catItems.find(it=>it.desc===row.desc);
    const check=validateGola({prices:descItem?descItem.prices:{}},f,v);
    if(!check.ok){toast(check.reason,'error',5000);return;}
    row.finish=f; row.variant=v; row.thickness=detectThickness(f);
    if(descItem) row.price=descItem.prices[val]||row.price;
  } else if(sec==='wardrobe'){
    const catItems=getPD().wardrobe[row.category]||[];
    const descItem=catItems.find(it=>it.desc===row.desc);
    row.finish=val; row.variant='';
    if(descItem){
      row.price=descItem.prices[val+'__standard']||row.price;
      if(descItem.thicknesses&&descItem.thicknesses[val+'__standard']) row.thickness=descItem.thicknesses[val+'__standard'];
      else row.thickness=WD_GLASS_CATS.has(row.category)?'':detectThickness(val);
    }
  }
  markDirty();
  closeModal(); refreshTable(sec);
}

// ====================================================================
// ROW OPERATIONS
// ====================================================================
function updateQty(sec,id,val){const unit=getUnit();if(!unit)return;const r=unit.items[sec].find(r=>r.id==id);if(r){r.qty=Math.max(0.1, Math.round(parseFloat(val)*10)/10||1);markDirty();refreshTable(sec);}}
function updateNotes(sec,id,val){const unit=getUnit();if(!unit)return;const r=unit.items[sec].find(r=>r.id==id);if(r){r.notes=val;markDirty();}}
function toggleRowBuffer(sec,id){const unit=getUnit();if(!unit)return;const r=unit.items[sec].find(r=>r.id==id);if(!r)return;r.buffer=r.buffer===true?false:true;markDirty();refreshTable(sec);toast(r.buffer?'Marked as buffer':'Buffer removed');}
function removeRow(sec,id){const unit=getUnit();if(!unit)return;unit.items[sec]=unit.items[sec].filter(r=>r.id!=id);selectedRows[sec].delete(String(id));markDirty();refreshTable(sec);updateTabCounts();renderSidebarUnits();}
function duplicateRow(sec,id){
  const unit=getUnit();if(!unit)return;
  const row=unit.items[sec].find(r=>r.id==id);if(!row)return;
  const n=JSON.parse(JSON.stringify(row));n.id=Date.now()+Math.random();n.altGroup=null;
  const idx=unit.items[sec].indexOf(row);unit.items[sec].splice(idx+1,0,n);
  markDirty();
  refreshTable(sec);updateTabCounts();renderSidebarUnits();toast('Row duplicated');
}
function toggleRowSelect(sec,id,checked){
  if(checked) selectedRows[sec].add(String(id)); else selectedRows[sec].delete(String(id));
  updateSelectionUI(sec);
}
function toggleAllRows(sec,checked){
  const unit=getUnit();if(!unit)return;
  if(checked) unit.items[sec].forEach(r=>selectedRows[sec].add(String(r.id)));
  else selectedRows[sec].clear();
  updateSelectionUI(sec);
}
function updateSelectionUI(sec){
  const unit=getUnit();if(!unit)return;
  const count=selectedRows[sec].size;
  const bar=document.getElementById('sel-bar-'+sec);
  if(bar){ bar.classList.toggle('hidden',count===0); const ct=bar.querySelector('.sel-count'); if(ct) ct.textContent=count+' item'+(count===1?'':'s')+' selected'; }
  unit.items[sec].forEach(r=>{
    const tr=document.querySelector(`tr[data-id="${r.id}"]`);
    if(tr){ const sel=selectedRows[sec].has(String(r.id)); tr.classList.toggle('row-sel',sel); const cb=tr.querySelector('input[type=checkbox]');if(cb)cb.checked=sel; }
  });
  const all=document.getElementById('sel-all-'+sec);
  if(all){ all.checked=count>0&&count===unit.items[sec].length; all.indeterminate=count>0&&count<unit.items[sec].length; }
}
function clearSelection(sec){ selectedRows[sec].clear(); updateSelectionUI(sec); }
function deleteSelected(sec){
  const unit=getUnit();if(!unit)return;
  const ids=selectedRows[sec];if(!ids.size)return;
  if(!confirm(`Delete ${ids.size} selected item${ids.size===1?'':'s'}?`))return;
  unit.items[sec]=unit.items[sec].filter(r=>!ids.has(String(r.id)));
  selectedRows[sec].clear();
  markDirty();
  refreshTable(sec);updateTabCounts();renderSidebarUnits();
  toast(ids.size+' item'+(ids.size===1?'':'s')+' deleted');
}
function showCopyToUnit(sec){
  const ids=selectedRows[sec];if(!ids.size){toast('No items selected','warn');return;}
  const unit=getUnit();
  const others=units.filter(u=>u.id!==unit.id);
  if(!others.length){toast('No other units available','warn');return;}
  const opts=others.map(u=>`<div class="db-item-row" onclick="copyToUnit('${sec}','${u.id}');closeModal()">${esc(u.name)}</div>`).join('');
  showModal(`<div class="modal-head"><h2>Copy to Unit</h2><button class="icon-x" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body"><p style="font-size:13px;color:var(--ink-faint);margin:0 0 10px">Copy ${ids.size} selected item${ids.size===1?'':'s'} to:</p>${opts}</div>
  <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
}
function copyToUnit(sec,targetId){
  const src=getUnit();const tgt=getUnit(targetId);if(!src||!tgt)return;
  const ids=selectedRows[sec];
  const toCopy=src.items[sec].filter(r=>ids.has(String(r.id)));
  toCopy.forEach(r=>tgt.items[sec].push({...r,id:Date.now()+Math.random(),altGroup:null}));
  markDirty();
  toast(`Copied ${toCopy.length} item${toCopy.length===1?'':'s'} to "${tgt.name}"`);
  renderSidebarUnits();if(currentView==='overview')renderOverview();
}
function changeFinishSelected(sec){
  if(!selectedRows[sec].size){toast('No items selected','warn');return;}
  const unit=getUnit();if(!unit)return;
  // Only finish-based items (exclude custom, no-finish, and glass wardrobe items)
  const eligible=unit.items[sec].filter(r=>
    selectedRows[sec].has(String(r.id)) && !r.custom && r.finish!=='(No Finish)' &&
    !(sec==='wardrobe'&&WD_GLASS_CATS.has(r.category)) &&
    !(sec==='wardrobe'&&WD_NOFIN_CATS.has(r.category))
  );
  if(!eligible.length){toast('No eligible items (custom, glass, and no-finish items are skipped)','warn');return;}
  const finishSet=new Set();
  eligible.forEach(r=>{
    const dataItems=(sec==='accessories'?[]:((getPD()[sec==='kitchen'?'kitchen':'wardrobe']||{})[r.category]||[]));
    dataItems.forEach(it=>Object.keys(it.prices).forEach(k=>{
      const f=k.split('__')[0];if(f&&f!=='(No Finish)')finishSet.add(f);
    }));
  });
  const finishes=[...finishSet].sort();
  if(!finishes.length){toast('No common finishes available.','warn');return;}
  const showHandle=sec==='kitchen';
  showModal(`<div class="modal-head"><h2>Change Finish · ${eligible.length} Item${eligible.length===1?'':'s'}</h2><button class="icon-x" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body">
    <div class="field"><label>New Finish</label><select class="select" id="bfc-finish">${finishes.map(f=>`<option>${esc(f)}</option>`).join('')}</select></div>
    ${showHandle?`<div class="field" id="bfc-handle-field"><label>Handle</label><select class="select" id="bfc-variant"><option value="standard">Standard</option><option value="gola">Gola</option></select></div>`:''}
    <p style="font-size:12px;color:var(--ink-faint);margin-top:4px">Items where the selected finish is unavailable will keep their current finish.</p>
  </div>
  <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="applyFinishChange('${sec}')">Apply</button></div>`);
}
function applyFinishChange(sec){
  const unit=getUnit();if(!unit)return;
  const newFinish=el('bfc-finish')?.value;
  const newVariant=el('bfc-variant')?.value||'standard';
  if(!newFinish){toast('Select a finish','warn');return;}
  let updated=0,skipped=0;
  unit.items[sec].forEach(r=>{
    if(!selectedRows[sec].has(String(r.id)))return;
    if(r.custom||r.finish==='(No Finish)'){skipped++;return;}
    if(sec==='wardrobe'&&(WD_GLASS_CATS.has(r.category)||WD_NOFIN_CATS.has(r.category))){skipped++;return;}
    const dataPool=sec==='kitchen'?getPD().kitchen:getPD().wardrobe;
    const catItems=(dataPool[r.category]||[]);
    const descItem=catItems.find(it=>it.desc===r.desc);
    if(!descItem){skipped++;return;}
    if(sec==='kitchen'){
      const variant=NO_HANDLE_CATS.has(r.category)?'standard':(newVariant||'standard');
      const key=newFinish+'__'+variant, stdKey=newFinish+'__standard';
      if(key in descItem.prices||stdKey in descItem.prices){
        r.finish=newFinish;r.variant=NO_HANDLE_CATS.has(r.category)?'':variant;
        r.thickness=detectThickness(newFinish);
        r.price=descItem.prices[key]||descItem.prices[stdKey]||r.price; updated++;
      } else skipped++;
    } else {
      const key=newFinish+'__standard';
      if(key in descItem.prices){
        r.finish=newFinish; r.variant='';
        if(descItem.thicknesses&&descItem.thicknesses[key]) r.thickness=descItem.thicknesses[key];
        else r.thickness=detectThickness(newFinish);
        r.price=descItem.prices[key]||r.price; updated++;
      } else skipped++;
    }
  });
  if(updated) markDirty();
  closeModal(); selectedRows[sec].clear();
  refreshTable(sec); renderSidebarUnits();
  toast(`Updated ${updated} item${updated===1?'':'s'}${skipped?`, ${skipped} skipped`:''}`, updated?'success':'warn');
}

  e.preventDefault(); e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('drop-above','drop-below'));
  if(id===dragUnit)return;
  const el=document.querySelector(`.sb-item[data-unit="${id}"]`);

function unitDrop(e,targetId){
  e.preventDefault();
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('drop-above','drop-below'));
  if(!dragUnit||dragUnit===targetId)return;
  const srcIdx=units.findIndex(u=>u.id===dragUnit);
  const tgtIdx=units.findIndex(u=>u.id===targetId);
  if(srcIdx<0||tgtIdx<0)return;
  const tgtEl=document.querySelector(`.sb-item[data-unit="${targetId}"]`);
  const after=tgtEl&&e.clientY>tgtEl.getBoundingClientRect().top+tgtEl.getBoundingClientRect().height/2;
  const [moved]=units.splice(srcIdx,1);
  const newTgt=units.findIndex(u=>u.id===targetId);
  units.splice(after?newTgt+1:newTgt,0,moved);
  markDirty();
  dragUnit=null; renderSidebarUnits();

function markDirty(){
  if(!dirty){ dirty=true; _lastAutosaveAt=null; }
  updateSaveStatus();
  clearTimeout(_autosaveDebounce);
  _autosaveDebounce=setTimeout(()=>{ if(dirty) autosaveNow(); }, 2500);   // M365-style: autosave shortly after the edit
}
function updateSaveStatus(state){
  const c=document.getElementById('saveStatus'); if(!c) return;
  let txt, cls='rev-pill save-status', dot=false;
  if(state==='saving'){ txt='Saving…'; cls+=' saving'; }
  else if(!dirty){ txt='Saved'; cls+=' saved'; }
  else if(_lastAutosaveAt){ txt='Autosaved '+_lastAutosaveAt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); cls+=' autosaved'; }
  else { txt='Unsaved edits'; cls+=' unsaved'; dot=true; }
  c.className=cls;
  c.innerHTML=(dot?'<span class="dirty-dot"></span>':'')+esc(txt);
}
function updateDirtyIndicator(){ updateSaveStatus(); }   // legacy callers
function updateAltVerChip(){ updateSaveStatus(); }       // legacy callers (chip replaced by save status)
function grandNow(){ return units.reduce((s,u)=>s+unitTotal(u),0); }
function itemsNow(){ return units.reduce((sum,u)=>sum+['kitchen','wardrobe','accessories'].reduce((ss,sec)=>ss+u.items[sec].length,0),0); }
function getActiveAlt(){ return alts.find(a=>a.key===activeAltKey) || alts[0]; }
function nextAltKey(){ return String.fromCharCode(65+alts.length); }

let _commit = {mode:'version', ready:false, nameError:false};
function openCommitModal(){ _commit={mode:'version', ready:false, nameError:false}; bufferGateThenCommit(); }

function openNewAltModal(){ _commit={mode:'alt', ready:false, nameError:false}; bufferGateThenCommit(); }
function commitToggleReady(){ _commit.ready=!_commit.ready; renderCommitModal(true); }
function commitSwitchMode(){ _commit.mode=_commit.mode==='alt'?'version':'alt'; _commit.nameError=false; renderCommitModal(); }

function renderCommitModal(keepInputs){
  syncProjectMetaFromDOM();
  const isAlt=_commit.mode==='alt';
  const alt=getActiveAlt(), latest=alt.versions[0]||null;
  const viewingOld=!!(latest&&activeVerNum&&activeVerNum<latest.ver);
  const canOverwrite=!!(latest&&latest.status==='Draft'&&!viewingOld);
  const nextKey=nextAltKey(), nextVer=(latest?latest.ver:0)+1, saveVer=canOverwrite?latest.ver:nextVer;
  const prevNote=keepInputs?(document.getElementById('cmt-note')?.value||''):'';
  const prevName=keepInputs?(document.getElementById('cmt-name')?.value||''):'';
  const title=isAlt?'Save as New Alternative':(canOverwrite?'Update Draft Version':'Save New Version');
  const headline=isAlt
    ? ('Saves the working calculation as Alt '+nextKey+' · v1 — a separate option the client picks between. Alt '+alt.key+' keeps its own versions.')
    : (canOverwrite
      ? ('Alt '+alt.key+' · v'+latest.ver+' is still a draft, so saving updates it in place. No new version is created.')
      : ('Saves the working calculation as Alt '+alt.key+' · v'+nextVer+'.'+(latest?(' v'+latest.ver+' stays in the history below it — the newest ready version is the one you quote.'):' This is the first saved version of this alternative.')));
  const switchHint=isAlt?('Just updating Alt '+alt.key+' instead?'):'Offering the client a different scheme instead?';
  const switchLabel=isAlt?((canOverwrite?'Update v':'Save as v')+saveVer+' of Alt '+alt.key):('Save as a new alternative (Alt '+nextKey+')');
  const confirmLabel=isAlt?('Save Alt '+nextKey+' · v1'):((canOverwrite?'Update Alt ':'Save Alt ')+alt.key+' · v'+saveVer);
  const countsLabel=units.length+' unit'+(units.length===1?'':'s')+' · '+itemsNow()+' items · pricelist '+(projectMeta.priceListVersion||PRICE_LIST_LATEST);
  const nameBorder=_commit.nameError?'var(--danger)':'var(--line)';
  const readyBox=`width:18px;height:18px;border-radius:5px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;border:1.5px solid ${_commit.ready?'var(--good)':'var(--line)'};background:${_commit.ready?'var(--good)':'var(--surface)'};color:#fff`;
  showModal(`
      <div class="modal-head"><h2>${esc(title)}</h2>
        <button class="icon-x" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body" style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;background:var(--panel);border:1px solid var(--line);border-radius:8px">
          <div><div style="font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.07em;font-weight:700">Working calculation</div>
            <div style="font-size:11.5px;color:var(--ink-faint);margin-top:2px">${esc(countsLabel)}</div></div>
          <div class="mono" style="font-weight:700;font-size:15px;color:var(--accent)">${fmt(grandNow())}</div>
        </div>
        <div style="font-size:12.5px;color:var(--ink-faint);line-height:1.6">${esc(headline)}</div>
        ${isAlt?`<div class="field"><label>Alternative name</label>
          <input class="input compact" id="cmt-name" placeholder="e.g. Dekton benchtop, Budget scheme…" value="${escAttr(prevName)}" style="border-color:${nameBorder}">
          ${_commit.nameError?`<div style="font-size:11.5px;color:var(--danger);font-weight:600;margin-top:4px">Name this alternative before saving — e.g. "Dekton benchtop".</div>`:''}</div>`:''}
        <div class="field"><label>What changed <span style="font-weight:600;text-transform:none;letter-spacing:0">(revision note)</span></label>
          <input class="input compact" id="cmt-note" placeholder="e.g. Client removed island unit, switched finish to Collalto Gold" value="${escAttr(prevNote)}"></div>
        <div onclick="commitToggleReady()" style="display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel)">
          <span style="${readyBox}">${_commit.ready?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" width="12" height="12"><path d="M20 6 9 17l-5-5"/></svg>':''}</span>
          <div><div style="font-size:13px;font-weight:700">Ready for quotation</div>
            <div style="font-size:11.5px;color:var(--ink-faint);margin-top:2px">Marks this version as final — the one to quote to the client. Untick to keep it as a draft — you can mark it ready later.</div></div>
        </div>
        <div style="font-size:12px;color:var(--ink-faint)">${esc(switchHint)} <span onclick="commitSwitchMode()" style="color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline">${esc(switchLabel)}</span></div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary" onclick="confirmCommit()">${esc(confirmLabel)}</button>
      </div>`);
}
function confirmCommit(){
  syncProjectMetaFromDOM();
  const note=(document.getElementById('cmt-note')?.value||'').trim();
  const name=(document.getElementById('cmt-name')?.value||'').trim();
  const entry={
    date:new Date().toISOString().split('T')[0],
    status:_commit.ready?'Ready for quotation':'Draft',
    note, total:grandNow(), unitsCount:units.length, itemsCount:itemsNow(),
    priceList:projectMeta.priceListVersion||PRICE_LIST_LATEST,
    snapshot:JSON.parse(JSON.stringify({units, unitCounter, priceListVersion:projectMeta.priceListVersion})),
  };
  if(_commit.mode==='alt'){
    if(!name){ _commit.nameError=true; renderCommitModal(true); toast('Give the new alternative a name (e.g. "Dekton benchtop").','warn'); return; }
    const key=nextAltKey();
    alts=[...alts, {key, name, versions:[{...entry, ver:1}]}];
    activeAltKey=key; activeVerNum=1; dirty=false;
    toast('Saved as Alt '+key+' · v1 — '+name);
  } else {
    const alt=getActiveAlt(), latest=alt.versions[0];
    const viewingOld=!!(latest&&activeVerNum&&activeVerNum<latest.ver);
    if(latest && latest.status==='Draft' && !viewingOld){
      alts=alts.map(a=> a.key!==alt.key ? a : {...a, versions:[{...entry, ver:latest.ver, note:note||latest.note}, ...a.versions.slice(1)]});
      activeVerNum=latest.ver; dirty=false;
      toast('Updated Alt '+alt.key+' · v'+latest.ver+' — draft updated in place, no new version');
    } else {
      const ver=(latest?latest.ver:0)+1;
      alts=alts.map(a=> a.key!==alt.key ? a : {...a, versions:[{...entry, ver}, ...a.versions.map(v=>({...v, status:'Superseded'}))]});
      activeVerNum=ver; dirty=false;
      toast('Saved Alt '+alt.key+' · v'+ver+(ver>1?' — v'+(ver-1)+' kept in history':''));
    }
  }
  closeModal(); updateDirtyIndicator(); updateAltVerChip(); renderOverview();
}
function loadVersion(altKey, ver){
  if(dirty && !window.confirm('Discard unsaved edits and load Alt '+altKey+' · v'+ver+'?')) return;
  const alt=alts.find(a=>a.key===altKey); const v=alt&&alt.versions.find(x=>x.ver===ver); if(!v) return;
  const snap=JSON.parse(JSON.stringify(v.snapshot));
  units=snap.units; unitCounter=snap.unitCounter||snap.units.length;
  projectMeta.priceListVersion=snap.priceListVersion||projectMeta.priceListVersion;
  activeUnitId=(snap.units[0]&&snap.units[0].id)||null;
  activeAltKey=altKey; activeVerNum=ver; dirty=false;
  updateRevPill(); updateDirtyIndicator(); updateAltVerChip();
  renderSidebarUnits(); showView('overview');
  const latest=alt.versions[0];
  toast('Loaded Alt '+altKey+' · v'+ver+(latest&&latest.ver>ver?' (older version)':''));
}
function toggleReady(altKey){
  alts=alts.map(a=>{
    if(a.key!==altKey||!a.versions.length) return a;
    const latest=a.versions[0];
    const status=latest.status==='Ready for quotation'?'Draft':'Ready for quotation';
    return {...a, versions:[{...latest, status}, ...a.versions.slice(1)]};
  });
  const alt=alts.find(a=>a.key===altKey);
  if(alt&&alt.versions.length) toast('Alt '+altKey+' · v'+alt.versions[0].ver+' → '+alt.versions[0].status);
  renderOverview();
}
function deleteAlt(key){
  const alt=alts.find(a=>a.key===key); if(!alt) return;
  if(alts.length<=1){ toast("A BOQ needs at least one alternative — you can't delete the last one",'warn'); return; }
  const label='Alt '+key+(alt.name?' — '+alt.name:'');
  if(!window.confirm('Delete '+label+'? Its saved versions will be removed. This can\'t be undone.')) return;
  const remaining=alts.filter(a=>a.key!==key);
  const relettered=remaining.map((a,i)=>({...a, key:String.fromCharCode(65+i)}));
  const wasActive=activeAltKey===key;
  const newActive=wasActive?relettered[0]:relettered[remaining.findIndex(a=>a.key===activeAltKey)];
  alts=relettered; activeAltKey=(newActive&&newActive.key)||'A';
  if(wasActive){
    const latest=newActive&&newActive.versions[0];
    activeVerNum=latest?latest.ver:null;
    if(latest&&latest.snapshot){
      const snap=JSON.parse(JSON.stringify(latest.snapshot));
      units=snap.units; unitCounter=snap.unitCounter||snap.units.length;
      activeUnitId=(snap.units[0]&&snap.units[0].id)||null; dirty=false;
    }
  }
  updateRevPill(); updateDirtyIndicator(); updateAltVerChip();
  renderSidebarUnits(); showView('overview'); toast('Deleted '+label);

// ====================================================================
// SAVE / LOAD
// ====================================================================
function getState(){
  syncProjectMetaFromDOM();
  return{version:3, revisionNumber, project:projectMeta, units, unitCounter,
    alts, activeAltKey, activeVerNum, savedAt:new Date().toISOString()};
}
// --- Native "Save As" dialog (showSaveFilePicker, Chrome/Edge) -------------
// The picker MUST be opened immediately on the user's click (browsers only honor
// it within the user-activation window), so saving is two-phase:
//   pickSaveHandle(filename)  → open the dialog FIRST, returns {mode, handle}
//   writePicked(pick, blob)   → later, write the generated file into the handle
// mode: 'picker' (dialog OK), 'cancelled' (user closed it), 'fallback' (no API /
// blocked, e.g. file:// pages — writePicked does a plain download instead).
async function pickSaveHandle(filename){
  if(!window.showSaveFilePicker) return {mode:'fallback',filename};
  const ext=filename.slice(filename.lastIndexOf('.'));
  const types={
    '.pdf':[{description:'PDF document',accept:{'application/pdf':['.pdf']}}],
    '.xlsx':[{description:'Excel workbook',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}],
    '.smbq':[{description:'SM BOQ project',accept:{'application/json':['.smbq']}}],
  };
  try{
    const handle=await window.showSaveFilePicker({suggestedName:filename,types:types[ext]});
    return {mode:'picker',handle,filename};
  }catch(e){
    if(e&&e.name==='AbortError') return {mode:'cancelled',filename};
    return {mode:'fallback',filename};   // SecurityError etc. → plain download
  }
}
async function writePicked(pick, blob){
  if(pick.mode==='cancelled') return false;
  if(pick.mode==='picker'){
    const w=await pick.handle.createWritable(); await w.write(blob); await w.close();
    return true;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=pick.filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  return true;
}
// Back-compat one-shot helper (dialog + write in one call)
async function saveBlobAs(blob, filename){
  return writePicked(await pickSaveHandle(filename), blob);
}
async function saveFile(){
  syncProjectMetaFromDOM();
  const fname=fileBaseNameDate()+'.smbq';   // whole project (all alts & versions) — no Alt segment
  const pick=await pickSaveHandle(fname);   // dialog first, while the click is fresh
  if(pick.mode==='cancelled'){ toast('Save cancelled','warn'); return; }
  const s=getState();
  await writePicked(pick, new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));
  toast('Saved '+fname);
  try{localStorage.removeItem(AUTOSAVE_KEY);}catch(e){}
}
// Restore a full saved state (used by loadFile and the autosave recovery).
function applyLoadedState(st){
  if(st.project){
    projectMeta=Object.assign({name:'',client:'',pic:'',date:'',notes:'',priceListVersion:''},st.project);
    if(!projectMeta.priceListVersion) projectMeta.priceListVersion=PRICE_LIST_LATEST;
  }
  units=st.units||[];unitCounter=st.unitCounter||units.length;activeUnitId=units[0]?.id||null;
  revisionNumber=st.revisionNumber||1;
  // Restore alternatives/versions (backward-compatible with older .smbq files)
  alts=(Array.isArray(st.alts)&&st.alts.length)?st.alts:[{key:'A', name:'Initial scheme', versions:[]}];
  activeAltKey=st.activeAltKey||alts[0].key;
  activeVerNum=(st.activeVerNum!==undefined)?st.activeVerNum:null;
  dirty=false;
  updateRevPill(); updateDirtyIndicator(); updateAltVerChip();
  renderSidebarUnits();showView('overview');
}

function loadFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      applyLoadedState(JSON.parse(e.target.result));
      toast('Loaded: '+file.name);
    }catch(err){toast('Failed to load: '+err.message,'error');}
  };
  reader.readAsText(file);input.value='';
}

function switchPriceList(v){
  if(!ALL_PRICE_DATA[v]){toast('Price list version not found','error');return;}
  const pd=ALL_PRICE_DATA[v];
  let updated=0, notFound=0;
  units.forEach(unit=>{
    ['kitchen','wardrobe','accessories'].forEach(sec=>{
      unit.items[sec].forEach(r=>{
        if(r.custom) return;
        const dataPool=sec==='accessories'?pd.accessories:(sec==='kitchen'?pd.kitchen:pd.wardrobe);
        const catItems=(dataPool[r.category])||[];
        const descItem=catItems.find(it=>it.desc===r.desc);
        if(!descItem){notFound++;return;}
        let key;
        if(sec==='accessories') key='(No Finish)__standard';
        else if(sec==='kitchen') key=r.finish+'__'+(r.variant||'standard');
        else key=r.finish+'__standard';
        const newPrice=descItem.prices[key]||(sec!=='accessories'?descItem.prices[r.finish+'__standard']:null);
        if(newPrice){r.price=newPrice;updated++;} else notFound++;
      });
    });
  });
  projectMeta.priceListVersion=v;
  markDirty();
  updateRevPill();
  renderOverview();
  if(currentView==='unit') renderUnitView(activeUnitId);
  const label=v===PRICE_LIST_LATEST?v:`${v} (not latest)`;
  toast(`Switched to ${label}: ${updated} item${updated===1?'':'s'} re-priced${notFound?` · ${notFound} not found`:''}`, updated?'success':'warn', 4000);
}

// Project Name + Client are mandatory before any export (they drive the document + filename).
function requireProjectFields(){
  syncProjectMetaFromDOM();
  const fields=[['projName','Project Name',(projectMeta.name||'').trim()],
                ['projClient','Client',(projectMeta.client||'').trim()],
                ['projPIC','PIC',(projectMeta.pic||'').trim()],
                ['projDate','Date',(projectMeta.date||'').trim()]];
  const missing=fields.filter(f=>!f[2]);
  if(!missing.length) return true;
  toast('Required before export: '+missing.map(f=>f[1]).join(', '),'warn',3500);
  if(currentView!=='overview') showView('overview');
  setTimeout(()=>{
    missing.forEach(([id])=>{const e=el(id); if(e){e.classList.add('field-error'); setTimeout(()=>e.classList.remove('field-error'),3000);}});
    const first=el(missing[0][0]); if(first) first.focus();
  },80);
  return false;
}
// Export filename: project name, date, quotation version, mode — Windows-safe.
function fileBaseNameDate(){
  const date=projectMeta.date||new Date().toISOString().slice(0,10);
  const name=(projectMeta.name||'BOQ').trim().replace(/\s*[–—]\s*/g,'_').replace(/\s+-\s+/g,'_');
  return (name+'_'+date).replace(/[\\/:*?"<>|]/g,'-');
}
function anyBufferItems(){ return units.some(u=>unitBufferTotal(u)>0); }

// ==== Export sets (version/alternative picker) ==============================
// A "set" is {altKey, ver} where ver is a saved version number or 'working'
// (the live calculation — only offered for the active alternative).
function setUnits(altKey,ver){
  if(ver==='working') return units;
  const a=alts.find(x=>x.key===altKey); const v=a&&a.versions.find(x=>x.ver===ver);
  return (v&&v.snapshot&&v.snapshot.units)||[];
}
function setLabel(s){
  return 'Alt '+s.altKey+(s.ver==='working'?' · current':' · v'+s.ver);
}
function defaultSets(){ return [{altKey:activeAltKey, ver:'working'}]; }
function setsHaveBuffer(sets){ return (sets||defaultSets()).some(s=>setUnits(s.altKey,s.ver).some(u=>unitBufferTotal(u)>0)); }
function setsVersionLabel(sets){
  if(!sets||sets.length<=1) return setLabel((sets||defaultSets())[0]);
  return sets.map(s=>s.altKey+(s.ver==='working'?'·cur':'·v'+s.ver)).join(' + ');
}
// "(Buffer)" only appears when buffer items are actually included in the document.
// NB: the filename intentionally carries NO Alt/version segment — the picker decides
// the content and the document itself states the version(s).
function exportFileBase(incBuf, sets){
  return fileBaseNameDate()+'_'+((incBuf&&setsHaveBuffer(sets))?'BOQ(Buffer)':'BOQ');
}

function getExportSets(){
  const rows=[...document.querySelectorAll('.exp-alt')];

    if(!cb.checked||cb.disabled) return;
    const k=cb.dataset.alt;
    const sel=document.querySelector('.exp-ver[data-alt="'+k+'"]');
    const v=sel?sel.value:'working';
    sets.push({altKey:k, ver:v==='working'?'working':parseInt(v,10)});
  });
  return sets.length?sets:null;
}
function expSelectAll(){ document.querySelectorAll('.exp-alt:not(:disabled)').forEach(cb=>{cb.checked=true;}); }
function confirmExport(kind,incBuf){
  const sets=getExportSets();
  if(!sets){ toast('Select at least one alternative to export','warn'); return; }
  const orient=_expOrient;
  closeModal();
  if(kind==='pdf') savePDF(incBuf,orient,sets); else exportExcel(incBuf,sets);
}
function setExpOrient(o){
  _expOrient=o;
  const p=document.getElementById('orient-portrait'), l=document.getElementById('orient-landscape'), h=document.getElementById('orient-hint');
  if(p){p.className='btn btn-sm '+(o==='portrait'?'primary':'ghost');}
  if(l){l.className='btn btn-sm '+(o==='landscape'?'primary':'ghost');}
  if(h){h.textContent=o==='portrait'?'two-line items · compact notes':'one-line items · wide notes';}
}

// ====================================================================
// EXCEL EXPORT — ExcelJS (inlined at build time; styled to match the PDF)
// ====================================================================
async function exportExcel(incBuf=true, sets=null){
  if(typeof ExcelJS==='undefined'){toast('ExcelJS not loaded — run the build','error');return;}
  if(!requireProjectFields()) return;
  try{
  sets=(sets&&sets.length)?sets:defaultSets();
  // Save-As dialog FIRST (while the click is fresh), generation after
  const pick=await pickSaveHandle(exportFileBase(incBuf,sets)+'.xlsx');
  if(pick.mode==='cancelled'){ toast('Export cancelled','warn'); return; }
  const plv=projectMeta.priceListVersion||PRICE_LIST_LATEST;
  const hasBuf=setsHaveBuffer(sets), showBufCol=incBuf&&hasBuf;
  const multi=sets.length>1;
  const docLine='BILL OF QUANTITIES'+(hasBuf?(incBuf?' — INCL. BUFFER':' — EXCL. BUFFER'):'');
  // Palette per docs/design/boq-format/BOQ-FORMAT-SPEC.md (matches the PDF export)
  const INK='FF1F1812', GRAY='FF7A7166', BRASS='FF8C6830', HAIR='FFE6E1D8', BUFFILL='FFE9EFF6', BUFC='FF3E648C';
  const MONEY='"Rp" #,##0';
  const NCOLS=showBufCol?11:10;
  const hdr=['#','Category','Description','Finish / Handle','Dims (W×H×D)','Unit Price','Qty','Unit','Total','Notes'].concat(showBufCol?['Buffer']:[]);
  const widths=[4,26,46,23,16,14,5,6,17,24].concat(showBufCol?[8]:[]);   // desc widened, finish narrowed; Total col 17 fits the 11pt unit-total figure
  const hairB={style:'thin',color:{argb:HAIR}};
  const bufHairB={style:'thin',color:{argb:'FFD8E2EE'}};
  const inkB={style:'medium',color:{argb:INK}};
  const solid=argb=>({type:'pattern',pattern:'solid',fgColor:{argb}});

  const wb=new ExcelJS.Workbook();
  wb.creator='Stella Mobili BOQ Tool';
  const usedSheetNames=new Set();   // Excel sheet names are case-insensitive
  const stellaImg=wb.addImage({base64:BOQ_LOGOS.stella,extension:'png'});
  const mulyaImg=wb.addImage({base64:BOQ_LOGOS.mulya,extension:'png'});

  // Brand header (rows 1–5): logos, doc line + company, meta band — mirrors the PDF header
  const addBrandHeader=(ws,ncols,verLabel)=>{
    const r1=ws.addRow([]); r1.height=40;
    const r2=ws.addRow([docLine]); r2.height=14;
    ws.mergeCells(r2.number,1,r2.number,6);
    r2.getCell(1).font={bold:true,size:8,color:{argb:BRASS}};
    ws.mergeCells(r2.number,7,r2.number,ncols);
    const cc=r2.getCell(7); cc.value='PT. MITRA USAHA LANCAR JAYA · JL. TEGALSARI 37';
    cc.font={bold:true,size:8,color:{argb:BRASS}}; cc.alignment={horizontal:'right'};
    for(let i=1;i<=ncols;i++) r2.getCell(i).border={bottom:inkB};
    const labels=['PROJECT','CLIENT','PIC','DATE','VERSION','PRICE LIST'];
    const values=[projectMeta.name,projectMeta.client,projectMeta.pic,projectMeta.date,verLabel,plv];
    const r3=ws.addRow(['',...labels]);
    labels.forEach((_,k)=>{r3.getCell(k+2).font={bold:true,size:7,color:{argb:BRASS}};});
    const r4=ws.addRow(['',...values.map(v=>v||'—')]);
    values.forEach((_,k)=>{r4.getCell(k+2).font={size:10,color:{argb:INK}};});
    for(let i=1;i<=ncols;i++) r4.getCell(i).border={bottom:hairB};
    ws.addRow([]);
    // NB: addImage LAST — an image anchor counts as a row in ExcelJS, so adding it
    // before the rows would shift every subsequent addRow down by one.
    ws.addImage(stellaImg,{tl:{col:0,row:0},ext:{width:162,height:46}});   // 121.92/34.58 aspect
    // MULYA right-aligned to the table's right edge: walk columns from the right and
    // anchor with NATIVE EMU offsets (fractional tl.col is unreliable — ExcelJS converts
    // fractions against a fixed default column width, not the actual one).
    // Column chars → px ≈ w*7+5 (Calibri 11); 1px = 9525 EMU.
    const MW_IMG=113;   // 85.04/34.58 aspect at 46px height
    let rem=MW_IMG;
    for(let i=ncols;i>=1;i--){
      const wpx=Math.round((ws.getColumn(i).width||8.43)*7+5);
      if(wpx>=rem){
        ws.addImage(mulyaImg,{tl:{nativeCol:i-1,nativeColOff:(wpx-rem)*9525,nativeRow:0,nativeRowOff:0},ext:{width:MW_IMG,height:46}});
        break;
      }
      rem-=wpx;
    }
  };
  const styleHeaderRow=row=>{
    for(let i=1;i<=NCOLS;i++){const c=row.getCell(i);c.font={bold:true,size:7,color:{argb:GRAY}};c.alignment={vertical:'middle',horizontal:i===6||i===9?'right':(i===7?'center':'left')};c.border={bottom:inkB};}
    row.height=16;
  };
  const addItemRow=(ws,r,n,offset)=>{
    const fin=r.finish==='(No Finish)'?'N/A':(r.finish+(r.variant&&r.variant!=='standard'?' / '+r.variant:'')+(r.thickness?' · '+r.thickness:''));
    const isBuf=incBuf&&r.buffer===true;
    const base=[n,r.category+(r.subcat?' · '+r.subcat:''),r.desc,fin,fmtDims(r),r.price,r.qty,r.unit||'',r.price*r.qty,r.notes||''].concat(showBufCol?[isBuf?'YES':'']:[]);
    const row=ws.addRow(offset?Array(offset).fill('').concat(base):base);
    const o=offset||0;
    for(let i=1;i<=NCOLS+o;i++){const c=row.getCell(i);c.border={bottom:isBuf?bufHairB:hairB};if(isBuf)c.fill=solid(BUFFILL);}
    row.getCell(1+o).font={size:9,color:{argb:GRAY}};
    row.getCell(3+o).font={bold:true,size:10,color:{argb:INK}};
    row.getCell(6+o).numFmt=MONEY;
    row.getCell(7+o).alignment={horizontal:'center'};
    row.getCell(9+o).numFmt=MONEY; row.getCell(9+o).font={bold:true,color:{argb:BRASS},size:10};
    row.getCell(10+o).font={size:9,color:{argb:GRAY}};
    if(showBufCol){const c=row.getCell(11+o);c.font={bold:true,size:8,color:{argb:BUFC}};c.alignment={horizontal:'center'};}
  };
  const addSecRow=(ws,sec,ncols)=>{
    const row=ws.addRow([sec.toUpperCase()]);
    ws.mergeCells(row.number,1,row.number,ncols);
    row.getCell(1).font={bold:true,size:8,color:{argb:GRAY}};
    row.height=14;
  };
  const addTotalRow=(ws,label,val,kind)=>{
    const row=ws.addRow(['','','','','','','',label,val]);
    row.getCell(8).alignment={horizontal:'right'};
    row.getCell(9).numFmt=MONEY;
    if(kind==='grand'){[8,9].forEach(i=>{const c=row.getCell(i);c.border={top:inkB};c.font={bold:true,size:11,color:{argb:INK}};});row.height=20;}
    else if(kind==='buf'){[8,9].forEach(i=>row.getCell(i).font={size:9,color:{argb:BUFC}});}
    else{row.getCell(8).font={bold:true,color:{argb:INK}};row.getCell(9).font={bold:true,color:{argb:BRASS}};}
  };
  const claimSheetName=base=>{
    let name=base, k=2;
    while(usedSheetNames.has(name.toLowerCase())) name=base+' ('+(k++)+')';
    usedSheetNames.add(name.toLowerCase());
    return name;
  };

  // ---- one Summary + unit sheets per selected set ----
  sets.forEach(set=>{
    const sUnits=setUnits(set.altKey,set.ver);
    const verLabel=setLabel(set);
    const prefix=multi?set.altKey+' · ':'';

    // pass 1: collect data for this set
    const unitData=[]; let grand=0, grandBuf=0;
    sUnits.forEach(unit=>{
      const rows=[]; ['kitchen','wardrobe','accessories'].forEach(sec=>exportRowsFor(unit,sec,incBuf).forEach(r=>rows.push({r,sec})));
      if(!rows.length) return;
      const uTot=rows.reduce((s2,{r})=>s2+r.price*r.qty,0);
      const uBuf=rows.reduce((s2,{r})=>s2+(r.buffer===true?r.price*r.qty:0),0);
      const secT={}; ['kitchen','wardrobe','accessories'].forEach(sec=>secT[sec]=rows.filter(x=>x.sec===sec).reduce((s2,{r})=>s2+r.price*r.qty,0));
      grand+=uTot; grandBuf+=uBuf;
      unitData.push({unit,rows,uTot,uBuf,secT});
    });

    // Summary sheet for the set
    const SNC=showBufCol?12:11;
    const sw=wb.addWorksheet(claimSheetName(multi?'Summary '+set.altKey:'Summary'));
    sw.pageSetup={paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:0.35,right:0.35,top:0.5,bottom:0.5,header:0.2,footer:0.2}};
    sw.columns=[{width:4},{width:20},{width:26},{width:46},{width:23},{width:20},{width:14},{width:5},{width:6},{width:15},{width:24}].concat(showBufCol?[{width:8}]:[]);   // col6 = 20: fits the 14pt grand-total figure
    addBrandHeader(sw,SNC,verLabel);
    if(projectMeta.notes){
      const nr=sw.addRow(['','NOTES',projectMeta.notes]);
      nr.getCell(2).font={bold:true,size:7,color:{argb:BRASS}};
      nr.getCell(3).font={size:9,color:{argb:GRAY}};
      sw.addRow([]);
    }
    const uhVals=['','Unit','Kitchen','Wardrobe','Accessories','Total'].concat(showBufCol?['Buffer']:[]);
    const uh=sw.addRow(uhVals.map((v,i)=>i>0?String(v).toUpperCase():v));
    for(let i=2;i<=uhVals.length;i++){const c=uh.getCell(i);c.font={bold:true,size:7,color:{argb:GRAY}};c.border={bottom:inkB};if(i>2)c.alignment={horizontal:'right'};}
    uh.height=16;
    unitData.forEach(({unit,uTot,uBuf,secT})=>{
      const row=sw.addRow(['',unit.name,secT.kitchen,secT.wardrobe,secT.accessories,uTot].concat(showBufCol?[uBuf||'']:[]));
      for(let i=3;i<=(showBufCol?7:6);i++){row.getCell(i).numFmt=MONEY;row.getCell(i).alignment={horizontal:'right'};}
      row.getCell(2).font={size:10,color:{argb:INK}};
      row.getCell(6).font={bold:true,size:10,color:{argb:BRASS}};
      for(let i=2;i<=(showBufCol?7:6);i++)row.getCell(i).border={bottom:hairB};
      if(showBufCol&&uBuf)row.getCell(7).font={size:9,color:{argb:BUFC}};
    });
    const g=sw.addRow(['','','','','GRAND TOTAL',grand]);
    [5,6].forEach(i=>{const c=g.getCell(i);c.border={top:inkB};});
    g.getCell(5).font={bold:true,size:9,color:{argb:INK}};g.getCell(5).alignment={horizontal:'right'};
    g.getCell(6).numFmt=MONEY;g.getCell(6).font={bold:true,size:14,color:{argb:INK}};g.getCell(6).alignment={horizontal:'right'};g.height=22;
    if(incBuf&&grandBuf>0){
      const b1=sw.addRow(['','','','','Buffer',grandBuf]);b1.getCell(6).numFmt=MONEY;[5,6].forEach(i=>{b1.getCell(i).font={size:9,color:{argb:BUFC}};b1.getCell(i).alignment={horizontal:'right'};});
      const b2=sw.addRow(['','','','','GRAND TOTAL excl. buffer',grand-grandBuf]);b2.getCell(6).numFmt=MONEY;[5,6].forEach(i=>{b2.getCell(i).font={bold:true,size:10,color:{argb:BUFC}};b2.getCell(i).alignment={horizontal:'right'};});
    }
    sw.addRow([]);
    const fl=sw.addRow(['','FULL ITEM LIST']);fl.getCell(2).font={name:'Libre Caslon Text',size:12,color:{argb:INK}};
    const fh=sw.addRow(['#','Unit',...hdr.slice(1)]);
    for(let i=1;i<=NCOLS+1;i++){const c=fh.getCell(i);c.font={bold:true,size:7,color:{argb:GRAY}};c.border={bottom:inkB};c.alignment={horizontal:i===7||i===10?'right':(i===8?'center':'left')};}
    fh.height=16;
    let rn=1;
    unitData.forEach(({unit,rows})=>rows.forEach(({r})=>{
      const fin=r.finish==='(No Finish)'?'N/A':(r.finish+(r.variant&&r.variant!=='standard'?' / '+r.variant:'')+(r.thickness?' · '+r.thickness:''));
      const isBuf=incBuf&&r.buffer===true;
      const row=sw.addRow([rn++,unit.name,r.category+(r.subcat?' · '+r.subcat:''),r.desc,fin,fmtDims(r),r.price,r.qty,r.unit||'',r.price*r.qty,r.notes||''].concat(showBufCol?[isBuf?'YES':'']:[]));
      for(let i=1;i<=NCOLS+1;i++){const c=row.getCell(i);c.border={bottom:isBuf?bufHairB:hairB};if(isBuf)c.fill=solid(BUFFILL);}
      row.getCell(1).font={size:9,color:{argb:GRAY}};
      row.getCell(4).font={bold:true,size:10,color:{argb:INK}};
      row.getCell(7).numFmt=MONEY;
      row.getCell(8).alignment={horizontal:'center'};
      row.getCell(10).numFmt=MONEY;row.getCell(10).font={bold:true,color:{argb:BRASS},size:10};
      row.getCell(11).font={size:9,color:{argb:GRAY}};
      if(showBufCol){const c=row.getCell(12);c.font={bold:true,size:8,color:{argb:BUFC}};c.alignment={horizontal:'center'};}
    }));

    // per-unit sheets for the set
    unitData.forEach(({unit,rows,uTot,uBuf})=>{
      const base=prefix+(unit.name.replace(/[\\/*?[\]:]/g,'').substring(0,multi?24:28)||'Unit');
      const ws=wb.addWorksheet(claimSheetName(base));
      ws.columns=widths.map(w=>({width:w}));
      addBrandHeader(ws,NCOLS,verLabel);
      const tr=ws.addRow([unit.name]);
      tr.getCell(1).font={name:'Libre Caslon Text',size:13,color:{argb:INK}};
      ws.mergeCells(tr.number,1,tr.number,NCOLS-2);
      ws.mergeCells(tr.number,NCOLS-1,tr.number,NCOLS);
      const tt=tr.getCell(NCOLS-1); tt.value=uTot; tt.numFmt=MONEY;
      tt.font={bold:true,size:11,color:{argb:BRASS}}; tt.alignment={horizontal:'right',vertical:'middle'};
      tr.height=20;
      styleHeaderRow(ws.addRow(hdr));
      ws.views=[{state:'frozen',ySplit:7}];
      ws.pageSetup={paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:0.35,right:0.35,top:0.5,bottom:0.5,header:0.2,footer:0.2},printTitlesRow:'7:7'};
      let n=1,lastSec='';
      rows.forEach(({r,sec})=>{
        if(sec!==lastSec){addSecRow(ws,sec,NCOLS);lastSec=sec;}
        addItemRow(ws,r,n++,0);
      });
      ws.addRow([]);
      addTotalRow(ws,'UNIT TOTAL',uTot,'grand');
      if(incBuf&&uBuf>0){ addTotalRow(ws,'Buffer',uBuf,'buf'); addTotalRow(ws,'excl. buffer',uTot-uBuf,'buf'); }
    });
  });

  // ---- write into the location picked at the start ----
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  await writePicked(pick, blob);
  toast('Excel exported'+(hasBuf?` (${incBuf?'with buffer':'without buffer'})`:''));
  }catch(err){ toast('Excel export failed: '+err.message,'error',5000); }
}

// ====================================================================
// PDF — pdfmake (inlined at build): direct .pdf download, A4 portrait
// ====================================================================
function buildPdfDoc(incBuf, orient, sets){
  sets=(sets&&sets.length)?sets:defaultSets();
  const land=orient==='landscape';
  const plv=projectMeta.priceListVersion||PRICE_LIST_LATEST;
  // Palette + metrics per docs/design/boq-format/BOQ-FORMAT-SPEC.md (handoff 2026-07-12)
  const INK='#1F1812', GRAY='#7A7166', BRASS='#8C6830', HAIR='#E6E1D8', BUFFILL='#E9EFF6', BUFHAIR='#D8E2EE', BUFC='#3E648C', BUFBORDER='#9FB4CC';
  const CW=land?776:529;   // A4 content width in pt (page − 2×33 margins)
  const LOGO_H=land?31.5:34.5;
  const hasBuf=setsHaveBuffer(sets);
  const multi=sets.length>1;
  const verLabel=setsVersionLabel(sets);
  const docLine='BILL OF QUANTITIES'+(hasBuf?(incBuf?' — INCL. BUFFER':' — EXCL. BUFFER'):'');
  const uTotal=u=>['kitchen','wardrobe','accessories'].reduce((s2,sec)=>s2+exportRowsFor(u,sec,incBuf).reduce((ss,r)=>ss+r.price*r.qty,0),0);
  const content=[];

  const metaCell=(l,v)=>({stack:[
    {text:l.toUpperCase(),fontSize:5.6,bold:true,color:BRASS,characterSpacing:0.9},
    {text:String(v||'—'),fontSize:8.25,color:INK,margin:[0,1.5,0,0]},
  ]});
  const metaCells=()=>[
    metaCell('Project',projectMeta.name), metaCell('Client',projectMeta.client),
    metaCell('PIC',projectMeta.pic), metaCell('Date',projectMeta.date),
    metaCell('Version',verLabel), metaCell('Price list',plv),
  ];

  // ---- header: brand logo left, MULYA constant top-right (branding rules) ----
  // logos as vector SVG (crisp at any print size); aspect ratios from the SVG viewBoxes
  const leftStack={width:land?'auto':'*',stack:[
    {svg:BOQ_LOGOS.stellaSvg,height:LOGO_H,width:LOGO_H*(121.92/34.58)},
    {text:docLine,fontSize:6,color:BRASS,characterSpacing:0.6,margin:[0,6.75,0,0]},
  ]};
  const rightStack={width:'auto',stack:[
    {svg:BOQ_LOGOS.mulyaSvg,height:LOGO_H,width:LOGO_H*(85.04/34.58),alignment:'right'},
    {text:'PT. MITRA USAHA LANCAR JAYA · JL. TEGALSARI 37',fontSize:6,color:BRASS,characterSpacing:0.6,alignment:'right',margin:[0,6.75,0,0]},
  ]};
  if(land){
    // landscape: the six meta cells sit inline between the logos (spec)
    content.push({columns:[leftStack,
      {width:'*',margin:[20,22,10,0],columns:metaCells().map(c=>Object.assign({width:'auto'},c)),columnGap:19.5},
      rightStack]});
  }else{
    content.push({columns:[leftStack,rightStack]});
  }
  content.push({canvas:[{type:'line',x1:0,y1:7.5,x2:CW,y2:7.5,lineWidth:1.1,lineColor:INK}]});
  if(!land){
    // portrait: meta band on its own row under the header rule
    const MW=(CW-5*10.5)/5.4;   // spread ≈ mock grid 1.1fr 1.1fr 0.7fr 0.9fr 0.8fr 0.8fr
    const mw=[MW*1.1,MW*1.1,MW*0.7,MW*0.9,MW*0.8,'*'];
    content.push({margin:[0,6.75,0,0],columnGap:10.5,columns:metaCells().map((c,i)=>Object.assign({width:mw[i]},c))});
    content.push({canvas:[{type:'line',x1:0,y1:6.75,x2:CW,y2:6.75,lineWidth:0.4,lineColor:HAIR}]});
  }
  if(projectMeta.notes) content.push({text:[{text:'NOTES   ',fontSize:5.6,bold:true,color:BRASS,characterSpacing:0.9},{text:projectMeta.notes,fontSize:7.1,color:GRAY}],margin:[0,5,0,0]});

  // ---- per-set rendering ----
  const th=(t,al)=>({text:t.toUpperCase(),fontSize:5.6,bold:true,color:GRAY,characterSpacing:0.8,alignment:al||'left',margin:[0,3,0,2]});
  const COLS=land?[18,'*',105,72,61.5,18,69,78.75]:[15,'*',52.5,65,52.5,16.5,60,66];   // spec widths (pt); finish narrowed in favor of the '*' description column (user request 2026-07-12)
  const PADX=land?4.5:3.75;
  // BUFFER tag as a bordered pill (1-cell table; fresh node per row — pdfmake mutates nodes)
  const pill=()=>({width:'auto',margin:[4,0.5,0,0],table:{body:[[{text:'BUFFER',fontSize:5.25,bold:true,color:BUFC,characterSpacing:0.75}]]},layout:{hLineWidth:()=>0.5,vLineWidth:()=>0.5,hLineColor:()=>BUFBORDER,vLineColor:()=>BUFBORDER,paddingLeft:()=>3,paddingRight:()=>2.25,paddingTop:()=>1,paddingBottom:()=>1}});

  sets.forEach((set,si)=>{
    const sUnits=setUnits(set.altKey,set.ver);
    const alt=alts.find(a=>a.key===set.altKey);
    const grand=sUnits.reduce((s2,u)=>s2+uTotal(u),0);
    const grandBuf=incBuf?sUnits.reduce((s2,u)=>s2+unitBufferTotal(u),0):0;

    if(multi){
      // alternative divider: each selected set starts on its own page
      content.push(Object.assign(si>0?{pageBreak:'before'}:{},{margin:[0,10,0,2],stack:[
        {canvas:[{type:'line',x1:0,y1:0,x2:CW,y2:0,lineWidth:1.5,lineColor:INK}]},
        {margin:[0,6,0,0],columns:[
          {text:'Alternative '+set.altKey+(alt&&alt.name?' — '+alt.name:''),font:'LibreCaslon',fontSize:13,color:INK,width:'*'},
          {text:setLabel(set).toUpperCase(),fontSize:7,bold:true,color:BRASS,characterSpacing:0.8,alignment:'right',margin:[0,5,0,0],width:'auto'},
        ]},
      ]}));
    }

    sUnits.forEach(u=>{
      const rows=[]; ['kitchen','wardrobe','accessories'].forEach(sec=>exportRowsFor(u,sec,incBuf).forEach(r=>rows.push({r,sec})));
      if(!rows.length) return;
      const uTot=uTotal(u), ub=incBuf?unitBufferTotal(u):0;
      // section header: Caslon title — hairline filler — optional excl-buffer note — brass total
      content.push({margin:[0,6,0,0],headlineLevel:1,columns:[
        {text:u.name,font:'LibreCaslon',fontSize:11.25,color:INK,width:'auto',noWrap:true},
        // stretchy hairline filler: borderless 1-cell table whose bottom rule spans the '*' column
        {width:'*',margin:[9,0,9,0],table:{widths:['*'],body:[[{text:'',fontSize:1}]]},layout:{hLineWidth:i=>i===1?0.4:0,hLineColor:()=>HAIR,vLineWidth:()=>0,paddingLeft:()=>0,paddingRight:()=>0,paddingTop:()=>7,paddingBottom:()=>0}},
        ...(ub>0?[{text:'(excl. buffer '+fmt(uTot-ub)+')',fontSize:6.4,color:GRAY,width:'auto',noWrap:true,margin:[0,3,6,0]}]:[]),
        {text:fmt(uTot),fontSize:8.6,bold:true,color:BRASS,width:'auto',noWrap:true,margin:[0,2,0,0]},
      ]});
      const body=[[th('#'),th('Description'),th('Category'),th('Finish'),th('Unit price','right'),th('Qty','center'),th('Total','right'),th('Notes')]];
      let lastSec='', n=0;
      rows.forEach(({r,sec})=>{
        if(sec!==lastSec){
          body.push([{text:sec.toUpperCase(),colSpan:8,fontSize:5.6,bold:true,color:GRAY,characterSpacing:0.8,margin:[0,2,0,0]},{},{},{},{},{},{},{}]);
          lastSec=sec; n=0;
        }
        n++;
        const isBuf=incBuf&&r.buffer===true;
        const fd=r.finish==='(No Finish)'?'N/A':(r.finish+(r.variant&&r.variant!=='standard'?' / '+r.variant:''));
        const dims=fmtDims(r);
        let descCell, catCell;
        if(land){
          // one-line rows: name + dims share the line; category + sub-category too
          const nameText={width:'auto',text:[{text:r.desc,bold:true,color:INK}].concat(dims?[{text:'   '+dims,fontSize:6.4,color:GRAY,bold:false}]:[]),fontSize:7.5,lineHeight:1.15};
          descCell=isBuf?{columns:[nameText,pill()],columnGap:0}:{text:nameText.text,fontSize:7.5,lineHeight:1.15};
          catCell={text:[{text:r.category}].concat(r.subcat?[{text:'  ·  '+r.subcat,fontSize:6.4,color:GRAY}]:[]),fontSize:7.5,color:INK};
        }else{
          const nameLine=isBuf
            ?{columns:[{width:'auto',text:r.desc,fontSize:7.9,bold:true,color:INK,lineHeight:1.15},pill()],columnGap:0}
            :{text:r.desc,fontSize:7.9,bold:true,color:INK,lineHeight:1.15};
          descCell={stack:[nameLine].concat(dims?[{text:dims,fontSize:6.4,color:GRAY,margin:[0,0.75,0,0]}]:[])};
          catCell={stack:[{text:r.category,fontSize:7.5,color:INK}].concat(r.subcat?[{text:r.subcat,fontSize:6.4,color:GRAY}]:[])};
        }
        const row=[
          {text:String(n),fontSize:7.1,color:GRAY},
          descCell,
          catCell,
          {text:fd+(r.thickness?' · '+r.thickness:''),fontSize:7.5,color:INK},
          {text:fmt(r.price),fontSize:7.5,color:INK,alignment:'right'},
          {text:String(r.qty),fontSize:7.5,color:INK,alignment:'center'},
          {text:fmt(r.price*r.qty),fontSize:7.5,bold:true,color:BRASS,alignment:'right'},
          {text:r.notes||'',fontSize:7.1,color:GRAY,lineHeight:1.2},
        ];
        row.__buffer=isBuf;   // read by fillColor/hLineColor in the layout below
        body.push(row);
      });
      content.push({margin:[0,2,0,0],table:{headerRows:1,widths:COLS,body,dontBreakRows:true},layout:{
        hLineWidth:i=>(i===1?0.75:(i===0?0:0.4)),
        hLineColor:(i,node)=>{ if(i===1) return INK; const row=node.table.body[i-1]; return row&&row.__buffer?BUFHAIR:HAIR; },
        vLineWidth:()=>0,
        fillColor:(i,node)=>(i>0&&node.table.body[i].__buffer?BUFFILL:null),
        paddingLeft:()=>PADX,paddingRight:()=>PADX,paddingTop:()=>2.25,paddingBottom:()=>2.25,
      }});
    });

    // ---- grand total block for the set (unbreakable: rule + figure + sub-line together) ----
    const gtLabel=(multi?'ALT '+set.altKey+' — ':'')+'GRAND TOTAL · SHOWROOM PRICE · EXCL. PPN'+(hasBuf?(incBuf?' · INCL. BUFFER':' · EXCL. BUFFER'):'');
    content.push({unbreakable:true,stack:[
      {canvas:[{type:'line',x1:0,y1:7.5,x2:CW,y2:7.5,lineWidth:1.5,lineColor:INK}],margin:[0,4,0,5]},
      {columns:[
        {text:gtLabel,fontSize:6,bold:true,color:INK,characterSpacing:1.35,margin:[0,6,0,0],width:'*'},
        {width:'auto',stack:[
          {text:fmt(grand),font:'LibreCaslon',fontSize:15.75,color:INK,alignment:'right'},
          ...(incBuf&&grandBuf>0?[{text:'excl. buffer '+fmt(grand-grandBuf)+' · buffer '+fmt(grandBuf),fontSize:6.4,color:GRAY,alignment:'right',margin:[0,1.5,0,0]}]:[]),
        ]}
      ]}
    ]});
  });

  return {
    pageSize:'A4', pageOrientation:land?'landscape':'portrait', pageMargins:[33,land?18:16,33,28],
    // orphan control: a unit headline stranded at the bottom of a page moves to the next
    // (following.length===0 misses tables that tentatively start on the page, so also
    //  break when the headline lands in the last 10% of the page height)
    pageBreakBefore:(node,following)=>node.headlineLevel===1&&(following.length===0||(node.startPosition&&node.startPosition.verticalRatio>0.9)),
    defaultStyle:{font:'LibreFranklin',fontSize:7.5,color:INK},
    content,
    footer:(cur,total)=>({margin:[33,6,33,0],stack:[
      {canvas:[{type:'line',x1:0,y1:0,x2:CW,y2:0,lineWidth:0.4,lineColor:HAIR}]},
      {margin:[0,5,0,0],columns:[
        {text:(projectMeta.name||'')+' · '+verLabel+' · '+plv,fontSize:6,color:GRAY,characterSpacing:0.45},
        {text:cur+' / '+total,fontSize:6,color:GRAY,alignment:'right'},
      ]},
    ]}),
    info:{title:(projectMeta.name||'BOQ')+' — BOQ', author:'Stella Mobili BOQ Tool'},
  };
}
async function savePDF(incBuf=true, orient='portrait', sets=null){
  if(typeof pdfMake==='undefined'){toast('pdfMake not loaded — run the build','error');return;}
  if(!requireProjectFields()) return;
  try{
    sets=(sets&&sets.length)?sets:defaultSets();
    // Save-As dialog FIRST (while the click is fresh), generation after
    const pick=await pickSaveHandle(exportFileBase(incBuf,sets)+'.pdf');
    if(pick.mode==='cancelled'){ toast('Save cancelled','warn'); return; }
    pdfMake.createPdf(buildPdfDoc(incBuf, orient, sets)).getBlob(async blob=>{
      await writePicked(pick, blob);
      toast('PDF saved'+(setsHaveBuffer(sets)?` (${incBuf?'with buffer':'without buffer'})`:''));
    });
  }catch(err){ toast('PDF export failed: '+err.message,'error',5000); }
}

// ====================================================================
// MODAL
// ====================================================================
function showModal(html, cls){
  const mount=document.getElementById('modal-mount');
  mount.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal${cls?' '+cls:''}">${html}</div></div>`;
}
function closeModal(){document.getElementById('modal-mount').innerHTML=''}

// ====================================================================
// TOAST
// ====================================================================
function toast(msg,type='success',dur=2500){
  const stack=document.getElementById('toast-stack');
  const t=document.createElement('div'); t.className='toast '+(type||'success');
  const icons={success:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,warn:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,error:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`};
  t.innerHTML=(icons[type]||icons.success);
  const sp=document.createElement('span'); sp.textContent=msg; t.appendChild(sp);
  stack.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(10px)';t.style.transition='all .3s';setTimeout(()=>t.remove(),300);},dur);
}

// ====================================================================
// HELPERS
// ====================================================================
function el(id){return document.getElementById(id)}
function fmt(n){return'Rp '+Math.round(n).toLocaleString('id-ID')}
function fmtShort(n){if(n>=1e9)return'Rp '+(n/1e9).toFixed(1)+'B';if(n>=1e6)return'Rp '+(n/1e6).toFixed(1)+'M';return'Rp '+Math.round(n).toLocaleString('id-ID')}
function fmtNum(n){return Math.round(n).toLocaleString('id-ID')}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// Custom qty stepper: paired up/down buttons injected next to a qty <input>, wrapped in .qtybox
const QSTEPS='<span class="qsteps">'
  +'<button type="button" tabindex="-1" onclick="stepQty(this,1)" aria-label="Increase quantity"><svg viewBox="0 0 12 8" width="11" height="7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6L6 2L10 6"/></svg></button>'
  +'<button type="button" tabindex="-1" onclick="stepQty(this,-1)" aria-label="Decrease quantity"><svg viewBox="0 0 12 8" width="11" height="7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2L6 6L10 2"/></svg></button>'
  +'</span>';
function stepQty(btn,d){
  const inp=btn.closest('.qtybox')?.querySelector('input'); if(!inp) return;
  let v=parseFloat(inp.value); if(!isFinite(v)) v=0;
  v=Math.round((v+d)*10)/10;
  const min=parseFloat(inp.min); if(isFinite(min)&&v<min) v=min; else if(v<0) v=0;
  inp.value=v;
  inp.dispatchEvent(new Event('change',{bubbles:true}));
}
function escAttr(s){return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
