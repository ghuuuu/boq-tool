function confirmCommit(){
  syncProjectMetaFromDOM();
  const note=(document.getElementById('cmt-note')?.value||'').trim();
  const name=(document.getElementById('cmt-name')?.value||'').trim();
  const entry={
    date:new Date().toISOString().split('T')[0],
    status:_commit.ready?'Ready for quotation':'Draft',
    note, total:grandNow(), unitsCount:units.length, itemsCount:itemsNow(),
    priceList:projectMeta.priceListVersion||PRICE_LIST_LATEST,
    snapshot:JSON.parse(JSON.stringify({units, unitCounter, priceListVersion:projectMeta.priceListVersion})),
  };
  if(_commit.mode==='alt'){
    if(!name){ _commit.nameError=true; renderCommitModal(true); toast('Give the new alternative a name (e.g. "Dekton benchtop").','warn'); return; }
    const key=nextAltKey();
    alts=[...alts, {key, name, versions:[{...entry, ver:1}]}];
    activeAltKey=key; activeVerNum=1; dirty=false;
    toast('Saved as Alt '+key+' · v1 — '+name);
  } else {
    const alt=getActiveAlt(), latest=alt.versions[0];
    const viewingOld=!!(latest&&activeVerNum&&activeVerNum<latest.ver);
    if(latest && latest.status==='Draft' && !viewingOld){
      alts=alts.map(a=> a.key!==alt.key ? a : {...a, versions:[{...entry, ver:latest.ver, note:note||latest.note}, ...a.versions.slice(1)]});
      activeVerNum=latest.ver; dirty=false;
      toast('Updated Alt '+alt.key+' · v'+latest.ver+' — draft updated in place, no new version');
    } else {
      const ver=(latest?latest.ver:0)+1;
      alts=alts.map(a=> a.key!==alt.key ? a : {...a, versions:[{...entry, ver}, ...a.versions.map(v=>({...v, status:'Superseded'}))]});
      activeVerNum=ver; dirty=false;
      toast('Saved Alt '+alt.key+' · v'+ver+(ver>1?' — v'+(ver-1)+' kept in history':''));
    }
  }
  closeModal(); updateDirtyIndicator(); updateAltVerChip(); renderOverview();
}
function loadVersion(altKey, ver){
  if(dirty && !window.confirm('Discard unsaved edits and load Alt '+altKey+' · v'+ver+'?')) return;
  const alt=alts.find(a=>a.key===altKey); const v=alt&&alt.versions.find(x=>x.ver===ver); if(!v) return;
  const snap=JSON.parse(JSON.stringify(v.snapshot));
  units=snap.units; unitCounter=snap.unitCounter||snap.units.length;
  projectMeta.priceListVersion=snap.priceListVersion||projectMeta.priceListVersion;
  activeUnitId=(snap.units[0]&&snap.units[0].id)||null;
  activeAltKey=altKey; activeVerNum=ver; dirty=false;
  updateRevPill(); updateDirtyIndicator(); updateAltVerChip();
  renderSidebarUnits(); showView('overview');
  const latest=alt.versions[0];
  toast('Loaded Alt '+altKey+' · v'+ver+(latest&&latest.ver>ver?' (older version)':''));
}
function toggleReady(altKey){
  alts=alts.map(a=>{
    if(a.key!==altKey||!a.versions.length) return a;
    const latest=a.versions[0];
    const status=latest.status==='Ready for quotation'?'Draft':'Ready for quotation';
    return {...a, versions:[{...latest, status}, ...a.versions.slice(1)]};
  });
  const alt=alts.find(a=>a.key===altKey);
  if(alt&&alt.versions.length) toast('Alt '+altKey+' · v'+alt.versions[0].ver+' → '+alt.versions[0].status);
  renderOverview();
}
function deleteAlt(key){
  const alt=alts.find(a=>a.key===key); if(!alt) return;
  if(alts.length<=1){ toast("A BOQ needs at least one alternative — you can't delete the last one",'warn'); return; }
  const label='Alt '+key+(alt.name?' — '+alt.name:'');
  if(!window.confirm('Delete '+label+'? Its saved versions will be removed. This can\'t be undone.')) return;
  const remaining=alts.filter(a=>a.key!==key);
  const relettered=remaining.map((a,i)=>({...a, key:String.fromCharCode(65+i)}));
  const wasActive=activeAltKey===key;
  const newActive=wasActive?relettered[0]:relettered[remaining.findIndex(a=>a.key===activeAltKey)];
  alts=relettered; activeAltKey=(newActive&&newActive.key)||'A';
  if(wasActive){
    const latest=newActive&&newActive.versions[0];
    activeVerNum=latest?latest.ver:null;
    if(latest&&latest.snapshot){
      const snap=JSON.parse(JSON.stringify(latest.snapshot));
      units=snap.units; unitCounter=snap.unitCounter||snap.units.length;
      activeUnitId=(snap.units[0]&&snap.units[0].id)||null; dirty=false;
    }
  }
  updateRevPill(); updateDirtyIndicator(); updateAltVerChip();
  renderSidebarUnits(); showView('overview'); toast('Deleted '+label);
}
function renameAlt(key,val){ const a=alts.find(a=>a.key===key); if(a){ a.name=val; } }
function selectAlt(key){
  if(key===activeAltKey) return;
  const alt=alts.find(a=>a.key===key); if(!alt) return;
  const latest=alt.versions[0];
  if(latest){ loadVersion(key, latest.ver); return; }
  if(dirty && !window.confirm('Switch to Alt '+key+'? Your unsaved edits stay in the editor and can be saved into Alt '+key+' as v1.')) return;
  activeAltKey=key; activeVerNum=null;
  updateAltVerChip(); renderOverview();
  toast('Now editing Alt '+key+' — use "Save as v1" when ready');
}
function renderRevisionsPanel(){

  const nextVer=(activeLatest?activeLatest.ver:0)+1, saveVer=canOverwrite?activeLatest.ver:nextVer;
  const saveBtnLabel=canOverwrite?('Update v'+saveVer):('Save as v'+nextVer);
  const dirtyColor=dirty?'var(--warn)':'var(--ink-faint)';

  const workingChip=`display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap;color:${dirtyColor};background:color-mix(in srgb,${dirtyColor} 10%,transparent);border:1px solid color-mix(in srgb,${dirtyColor} 30%,transparent)`;
  const altRows=alts.map(a=>{
    const latest=a.versions[0]||null;
    const isActive=a.key===activeAltKey;
    const badgeStyle=`display:inline-flex;align-items:center;padding:3px 9px;border-radius:6px;font-size:10.5px;font-weight:800;letter-spacing:.06em;font-family:var(--font-num);font-variant-numeric:tabular-nums;flex-shrink:0;background:${isActive?'var(--accent)':'color-mix(in srgb,var(--ink-faint) 14%,transparent)'};color:${isActive?'var(--on-accent)':'var(--ink-faint)'}`;

    const verChips=a.versions.slice().reverse().map(v=>{
      const isLoaded=isActive&&activeVerNum===v.ver, isLatest=latest&&v.ver===latest.ver;
      const chip=`padding:3px 11px;border-radius:999px;font-size:11px;font-weight:700;font-family:var(--font-num);font-variant-numeric:tabular-nums;cursor:pointer;white-space:nowrap;flex-shrink:0;border:1px solid ${isLoaded?'var(--accent)':(isLatest?'color-mix(in srgb,var(--accent) 42%,transparent)':'var(--line)')};background:${isLoaded?'var(--accent)':'transparent'};color:${isLoaded?'var(--on-accent)':(isLatest?'var(--accent)':'var(--ink-faint)')}`;

    }).join('');
    const metaLine=latest?('latest v'+latest.ver+' · '+latest.date+(latest.note?' — '+esc(latest.note):'')):'no versions yet — use "Save as v1"';
    const readyLabel=latest&&latest.status==='Ready for quotation'?'Back to Draft':'Mark Ready';
    return `<div style="${rowStyle}" ${isActive?'':`onclick="selectAlt('${a.key}')"`} title="${isActive?'':'Click to switch to this alternative'}">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="${badgeStyle}">ALT ${a.key}</span>
        <input value="${escAttr(a.name)}" onclick="event.stopPropagation()" onchange="renameAlt('${a.key}',this.value)" title="Click to rename this alternative" style="flex:1;min-width:140px;background:transparent;border:none;font-size:13.5px;font-weight:700;color:var(--ink);font-family:inherit;outline:none;padding:0;cursor:text">
        <span style="${pill(latest?stColor(latest.status):'var(--ink-faint)')}">${latest?esc(latest.status):'Not saved yet'}</span>
        <span class="mono" style="font-weight:700;font-size:13px;color:var(--accent)">${latest?fmt(latest.total):'—'}</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        ${verChips}
        <span style="font-size:11.5px;color:var(--ink-faint)">${metaLine}</span>
        <span style="flex:1"></span>
        ${latest?`<button class="btn btn-xs" onclick="event.stopPropagation();toggleReady('${a.key}')">${readyLabel}</button>`:''}
        ${alts.length<=1?'':`<button class="btn btn-xs danger" onclick="event.stopPropagation();deleteAlt('${a.key}')" title="Delete this alternative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>`}
      </div>
    </div>`;
  }).join('');
  const oldBanner=viewingOld?`<div style="display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:8px;flex-wrap:wrap;margin-bottom:10px">
    <span style="font-size:12.5px;color:var(--warn);font-weight:600;flex:1;min-width:200px">Viewing older version Alt ${alt.key} · v${activeVerNum}. Saving will add a new version on top of the latest.</span>
    <button class="btn btn-xs" onclick="loadVersion('${alt.key}',${activeLatest.ver})">Load latest</button></div>`:'';
  return `<div class="card" style="margin-bottom:16px">
    <div class="card-head"><div class="row" style="gap:10px;flex-wrap:wrap;align-items:center">
        <div class="card-title">Revisions &amp; Alternatives</div>
        <span style="${workingChip}">${esc(workingLabel)}</span></div>
      <div class="row" style="gap:8px">
        <button class="btn btn-sm primary-outline" onclick="openNewAltModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New Alternative</button>
        <button class="btn btn-sm primary" onclick="openCommitModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><path d="M20 6 9 17l-5-5"/></svg>${saveBtnLabel}</button>
      </div>
    </div>
    <div class="card-body">
      <div style="font-size:12px;color:var(--ink-faint);line-height:1.6;margin-bottom:10px"><b style="color:var(--ink)">How it works:</b> build the calculation, then <b style="color:var(--ink)">save it as a version</b> (while a version is still a draft, saving updates it in place; once it's marked Ready, saving creates v2, v3… — the newest is the one you quote). Offering the client a different scheme? Save it as a <b style="color:var(--ink)">new alternative</b> (Alt B) — alternatives sit side by side and the client picks one. Everything travels inside the <b style="color:var(--ink)">.smbq</b> file.</div>
      ${oldBanner}
      ${altRows}
    </div>
  </div>`;
}

// ====================================================================
// SAVE / LOAD
// ====================================================================
function getState(){
  syncProjectMetaFromDOM();
  return{version:3, revisionNumber, project:projectMeta, units, unitCounter,
    alts, activeAltKey, activeVerNum, savedAt:new Date().toISOString()};
}
function saveFile(){
  syncProjectMetaFromDOM();
  const s=getState();
  const proj=(projectMeta.name||'BOQ').trim();
  const plv=projectMeta.priceListVersion||PRICE_LIST_LATEST;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));
  a.download=`${proj} ${plv}.smbq`;
  a.click(); toast('Saved '+a.download);
}
function loadFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const s=JSON.parse(e.target.result);
      if(s.project){
        projectMeta=Object.assign({name:'',client:'',pic:'',date:'',notes:'',priceListVersion:''},s.project);
        if(!projectMeta.priceListVersion) projectMeta.priceListVersion=PRICE_LIST_LATEST;
      }
      units=s.units||[];unitCounter=s.unitCounter||units.length;activeUnitId=units[0]?.id||null;
      revisionNumber=s.revisionNumber||1;
      // Restore alternatives/versions (backward-compatible with older .smbq files)
      alts=(Array.isArray(s.alts)&&s.alts.length)?s.alts:[{key:'A', name:'Initial scheme', versions:[]}];
      activeAltKey=s.activeAltKey||alts[0].key;
      activeVerNum=(s.activeVerNum!==undefined)?s.activeVerNum:null;
      dirty=false;
      updateRevPill(); updateDirtyIndicator(); updateAltVerChip();
      renderSidebarUnits();showView('overview');toast('Loaded: '+file.name);
    }catch(err){toast('Failed to load: '+err.message,'error');}
  };
  reader.readAsText(file);input.value='';
}

// ====================================================================
// SWITCH PRICE LIST
// ====================================================================
function switchPriceList(v){
  if(!ALL_PRICE_DATA[v]){toast('Price list version not found','error');return;}
  const pd=ALL_PRICE_DATA[v];
  let updated=0, notFound=0;
  units.forEach(unit=>{
    ['kitchen','wardrobe','accessories'].forEach(sec=>{
      unit.items[sec].forEach(r=>{
        if(r.custom) return;
        const dataPool=sec==='accessories'?pd.accessories:(sec==='kitchen'?pd.kitchen:pd.wardrobe);
        const catItems=(dataPool[r.category])||[];
        const descItem=catItems.find(it=>it.desc===r.desc);
        if(!descItem){notFound++;return;}
        let key;
        if(sec==='accessories') key='(No Finish)__standard';
        else if(sec==='kitchen') key=r.finish+'__'+(r.variant||'standard');
        else key=r.finish+'__standard';
        const newPrice=descItem.prices[key]||(sec!=='accessories'?descItem.prices[r.finish+'__standard']:null);
        if(newPrice){r.price=newPrice;updated++;} else notFound++;
      });
    });
  });
  projectMeta.priceListVersion=v;
  markDirty();
  updateRevPill();
  renderOverview();
  if(currentView==='unit') renderUnitView(activeUnitId);
  const label=v===PRICE_LIST_LATEST?v:`${v} (not latest)`;
  toast(`Switched to ${label}: ${updated} item${updated===1?'':'s'} re-priced${notFound?` · ${notFound} not found`:''}`, updated?'success':'warn', 4000);
}

// ====================================================================
// EXCEL EXPORT
// ====================================================================
function exportExcel(){
  if(typeof XLSX==='undefined'){toast('XLSX not loaded','error');return;}
  syncProjectMetaFromDOM();
  const proj=projectMeta.name||'BOQ', wb=XLSX.utils.book_new();
  const hdr=['#','Unit','Category','Subcat','Finish','Handle','Dims (W×H×D)','Description','Unit Price (IDR)','Qty','Total (IDR)','Notes','Buffer'];
  const allRows=[]; let rn=1;
  units.forEach(unit=>{
    const sr=[hdr]; let n=1;
    ['kitchen','wardrobe','accessories'].forEach(sec=>unit.items[sec].forEach(r=>{
      const dims=fmtDims(r);
      const row=[n++,unit.name,r.category,r.subcat||'',r.finish+(r.thickness&&r.finish!=='(No Finish)'?' · '+r.thickness:''),r.variant||'',dims,r.desc,r.price,r.qty,r.price*r.qty,r.notes||'',(r.buffer===true?'YES':'')];
      sr.push(row); allRows.push([rn++,unit.name,...row.slice(1)]);
    }));
    const uBuf=unitBufferTotal(unit);
    sr.push([]); sr.push(['','','','','','','','','','UNIT TOTAL →',unitTotal(unit),'','']);
    if(uBuf>0) sr.push(['','','','','','','','','','of which buffer →',uBuf,'','']);
    const ws=XLSX.utils.aoa_to_sheet(sr);
    ws['!cols']=[{wch:4},{wch:18},{wch:14},{wch:22},{wch:26},{wch:10},{wch:14},{wch:42},{wch:16},{wch:6},{wch:16},{wch:28},{wch:8}];
    XLSX.utils.book_append_sheet(wb,ws,(unit.name.replace(/[\\/*?[\]]/g,'').substring(0,31)||'Unit'));
  });
  const sum=[['PROJECT BOQ — STELLA MOBILI'],['Project',projectMeta.name,'Client',projectMeta.client,'PIC',projectMeta.pic,'Date',projectMeta.date],['Notes',projectMeta.notes],['Alt / Version','Alt '+activeAltKey+(activeVerNum?' · v'+activeVerNum:' · draft')],['Price List',projectMeta.priceListVersion||PRICE_LIST_LATEST],[],['UNIT TOTALS'],['Unit','Kitchen','Wardrobe','Accessories','Total']];
  units.forEach(u=>{const k=secTotal(u,'kitchen'),w=secTotal(u,'wardrobe'),a=secTotal(u,'accessories');sum.push([u.name,k,w,a,k+w+a]);});
  sum.push([],[,'','','','GRAND TOTAL',units.reduce((s,u)=>s+unitTotal(u),0)],[],['FULL ITEM LIST'],hdr,...allRows);
  const ws2=XLSX.utils.aoa_to_sheet(sum);ws2['!cols']=[{wch:4},{wch:18},{wch:14},{wch:22},{wch:26},{wch:10},{wch:14},{wch:42},{wch:16},{wch:6},{wch:16},{wch:28}];
  XLSX.utils.book_append_sheet(wb,ws2,'Summary');
  wb.SheetNames=['Summary',...wb.SheetNames.filter(n=>n!=='Summary')];
  const plv=projectMeta.priceListVersion||PRICE_LIST_LATEST;
  XLSX.writeFile(wb,`${proj} ${plv}.xlsx`);
  toast('Excel exported');
}

        <div style="border:1px solid #4c1d95;border-radius:8px;padding:10px;background:#f5f3ff"><div style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#6c7080;font-weight:700;margin-bottom:4px">Grand Total</div><div style="font-size:16px;font-weight:700;font-family:JetBrains Mono,monospace;color:#4c1d95">Rp ${Math.round(grand).toLocaleString('id-ID')}</div></div>
      </div>
    </div>
    ${units.map(u=>{
      const hasContent=['kitchen','wardrobe','accessories'].some(s=>u.items[s].length>0);if(!hasContent)return'';
      return `<div class="print-unit-block">
        <div style="background:#4c1d95;color:white;padding:10px 14px;border-radius:8px 8px 0 0;display:flex;justify-content:space-between;font-weight:700">
          <span>${esc(u.name)}</span><span style="font-family:JetBrains Mono,monospace">${fmt(unitTotal(u))}</span>
        </div>
        ${['kitchen','wardrobe','accessories'].map(sec=>{
          if(!u.items[sec].length)return'';
          const sub=u.items[sec].reduce((s,r)=>s+r.price*r.qty,0);
          return `<div style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:#6c7080;padding:8px 14px;border-bottom:1px solid #eee;background:#faf8ff">${sec}</div>
          <table class="bom-table" style="border-radius:0;border:none;border-bottom:1px solid #eee">
            <thead><tr><th style="padding-left:14px">#</th><th>Category</th><th>Finish</th><th>Description</th><th>Unit Price</th><th>Qty</th><th>Total</th><th>Notes</th></tr></thead>
            <tbody>${u.items[sec].map((r,i)=>{
              const fd=r.finish==='(No Finish)'?'N/A':(r.finish+(r.variant&&r.variant!=='standard'?' / '+r.variant:''));
              const dims=fmtDims(r);
              return `<tr><td style="padding-left:14px">${i+1}</td><td>${esc(r.category)}</td><td style="font-size:11px;color:#6c7080">${esc(fd)}${r.thickness&&r.finish!=='(No Finish)'?` · ${r.thickness}`:''}</td><td><strong>${esc(r.desc)}</strong>${r.buffer===true?' <span style="font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;background:#eaf0f6;color:#3e648c;vertical-align:middle">BUFFER</span>':''}${dims?`<br><span style="font-size:9px;color:#6c7080">${dims}</span>`:''}</td><td style="text-align:right;font-family:monospace">${fmt(r.price)}</td><td style="text-align:center">${r.qty}</td><td style="text-align:right;font-family:monospace;font-weight:700;color:#4c1d95">${fmt(r.price*r.qty)}</td><td style="font-size:11px;color:#6c7080">${esc(r.notes||'')}</td></tr>`;
            }).join('')}</tbody>
            <tfoot><tr><td colspan="6" style="padding-left:14px">Subtotal · ${sec}${secBufferTotal(u,sec)>0?` <span style="font-weight:600;font-size:10px;color:#3e648c">incl. buffer ${fmt(secBufferTotal(u,sec))}</span>`:''}</td><td>${fmt(sub)}</td><td></td></tr></tfoot>
          </table>`;
        }).join('')}
      </div>`;
    }).join('')}
    <div style="background:#4c1d95;color:white;border-radius:8px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-top:16px">
      <span style="font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.8">Grand Total · All Units · Showroom Price · Excl. PPN${(()=>{const gb=units.reduce((s,u)=>s+unitBufferTotal(u),0);return gb>0?' · incl. buffer '+fmt(gb):'';})()}</span>
      <span style="font-size:20px;font-family:JetBrains Mono,monospace;font-weight:800">${fmt(grand)}</span>
    </div>`;
  ['view-overview','view-unit'].forEach(id=>{const e=document.getElementById(id);if(e)e.classList.add('hidden')});
  setTimeout(()=>{window.print();setTimeout(()=>{wrap.innerHTML='';['view-overview','view-unit'].forEach(id=>{const e=document.getElementById(id);if(e)e.classList.remove('hidden')});},800);},300);
}

// ====================================================================
// MODAL
// ====================================================================
function showModal(html, cls){
  const mount=document.getElementById('modal-mount');
  mount.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal${cls?' '+cls:''}">${html}</div></div>`;
}
function closeModal(){document.getElementById('modal-mount').innerHTML=''}

// ====================================================================
// TOAST
// ====================================================================
function toast(msg,type='success',dur=2500){
  const stack=document.getElementById('toast-stack');
  const t=document.createElement('div'); t.className='toast '+(type||'success');
  const icons={success:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`,warn:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,error:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`};
  t.innerHTML=(icons[type]||icons.success)+`<span>${msg}</span>`;
  stack.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(10px)';t.style.transition='all .3s';setTimeout(()=>t.remove(),300);},dur);
}

// ====================================================================
// HELPERS
// ====================================================================
function el(id){return document.getElementById(id)}
function fmt(n){return'Rp '+Math.round(n).toLocaleString('id-ID')}
function fmtShort(n){if(n>=1e9)return'Rp '+(n/1e9).toFixed(1)+'B';if(n>=1e6)return'Rp '+(n/1e6).toFixed(1)+'M';return'Rp '+Math.round(n).toLocaleString('id-ID')}
function fmtNum(n){return Math.round(n).toLocaleString('id-ID')}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// Custom qty stepper: paired up/down buttons injected next to a qty <input>, wrapped in .qtybox
const QSTEPS='<span class="qsteps">'
  +'<button type="button" tabindex="-1" onclick="stepQty(this,1)" aria-label="Increase quantity"><svg viewBox="0 0 12 8" width="11" height="7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6L6 2L10 6"/></svg></button>'
  +'<button type="button" tabindex="-1" onclick="stepQty(this,-1)" aria-label="Decrease quantity"><svg viewBox="0 0 12 8" width="11" height="7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2L6 6L10 2"/></svg></button>'
  +'</span>';
function stepQty(btn,d){
  const inp=btn.closest('.qtybox')?.querySelector('input'); if(!inp) return;
  let v=parseFloat(inp.value); if(!isFinite(v)) v=0;
  v=Math.round((v+d)*10)/10;
  const min=parseFloat(inp.min); if(isFinite(min)&&v<min) v=min; else if(v<0) v=0;
  inp.value=v;
  inp.dispatchEvent(new Event('change',{bubbles:true}));
}
function escAttr(s){return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
