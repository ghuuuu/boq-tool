<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stella Mobili BOQ — MulyaOne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============================================================
   SM BOQ — Warm brass/cream palette · Hanken Grotesk · MulyaOne UI system
   ============================================================ */
:root{
  /* ===== Warm brass / cream palette — synced from Claude Design (2026-07) ===== */
  /* Semantic design tokens */
  --bg:#F1ECE1;
  --panel:#FBF9F4;
  --panel2:#FFFFFF;
  --surface:#FFFFFF;
  --ink:#26221B;
  --ink-soft:#4A4438;
  --ink-faint:#7A7264;
  --ink2:#7A7264;
  --line:#E4DCCC;
  --line-soft:#EFE9DC;
  --accent:#8A5A3B;
  --on-accent:#ffffff;
  --brass:#A6803E;
  --sidebar:#26221B;
  --sidebar-ink:#C7BCA6;
  /* Number/price font — Hanken Grotesk w/ tabular figures (Claude Design priceFont, 2026-07-11) */
  --font-num:'Hanken Grotesk',system-ui,sans-serif;
  /* Purple scale remapped onto the warm palette so existing rules re-skin */
  --pu-50:#F1E9DB;
  --pu-75:#ECE2CF;
  --pu-100:#E4DCCC;
  --pu-200:#D8C7A6;
  --pu-300:#C2A377;
  --pu-400:#A6803E;
  --pu-500:#8A5A3B;
  --pu-600:#79492F;
  --pu-700:#5E3A24;
  --pu-800:#3E2718;
  --pu-900:#26221B;
  --gold:#A6803E;
  --gold-bg:#F7F1E4;
  --warn:#B4832E;
  --warn-bg:#FBF3E1;
  --good:#3E7C5A;
  --good-bg:#E7F1EA;
  --danger:#B4483E;
  --danger-bg:#F8E9E7;
  --buffer:#3E648C;
  --buffer-bg:#EAF0F6;
  --shadow-sm:0 1px 2px rgba(50,40,24,.06),0 1px 1px rgba(50,40,24,.04);
  --shadow-md:0 4px 14px rgba(50,40,24,.08),0 2px 4px rgba(50,40,24,.05);
  --shadow-lg:0 12px 36px rgba(50,40,24,.13),0 6px 12px rgba(50,40,24,.07);
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:14px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* ===== Topbar ===== */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 20px;height:57px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-sm)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--brass);display:grid;place-items:center;color:var(--on-accent);font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.25);flex-shrink:0}
.brand-mark svg{width:17px;height:17px}
.brand-name{display:flex;flex-direction:column;line-height:1.05}
.brand-name strong{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand-name span{font-size:12px;color:var(--ink-faint);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.crumb{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-size:14px;color:var(--ink-soft);overflow:hidden;white-space:nowrap}
.crumb .sep{color:var(--line);font-weight:600}
.crumb .here{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;align-items:center;gap:6px}
.rev-pill{background:var(--pu-50);color:var(--pu-700);border:1px solid var(--pu-100);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.04em;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.alt-ver-chip{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.tool-ver-chip{background:transparent;color:var(--ink2);border-color:var(--line)}
.dirty-flag{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--warn);font-weight:600;flex-shrink:0}
.dirty-dot{width:7px;height:7px;border-radius:999px;background:var(--warn);animation:dirtyPulse 1.6s ease-in-out infinite}
@keyframes dirtyPulse{0%,100%{opacity:1}50%{opacity:.35}}
.topbar-iconbtns{display:flex;align-items:center;gap:2px;margin-left:2px}
.topbar-iconbtns .icon-btn{width:32px;height:32px}
.icon-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink-soft);border:1px solid transparent;transition:background .15s,color .15s,border-color .15s;cursor:pointer}
.icon-btn:hover{background:var(--pu-50);color:var(--pu-600);border-color:var(--pu-100)}
.icon-btn svg{width:17px;height:17px}
.menu-btn{display:none;width:34px;height:34px;border-radius:8px;place-items:center;color:var(--ink-soft);border:1px solid var(--line)}

/* ===== Shell ===== */
.shell{position:relative;display:grid;grid-template-columns:var(--sidebar-w,260px) 1fr;min-height:calc(100vh - 57px)}

/* ===== Sidebar ===== */
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}

/* Sidebar drag-to-resize handle (desktop only) — sits over the sidebar/main border */
.sb-resizer{display:none;position:absolute;top:0;bottom:0;left:var(--sidebar-w,260px);width:8px;margin-left:-4px;cursor:col-resize;z-index:60;background:transparent;transition:background .15s}
.sb-resizer::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:26px;border-radius:2px;background:var(--line);transition:background .15s}
.sb-resizer:hover,.sb-resizer.dragging{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.sb-resizer:hover::after,.sb-resizer.dragging::after{background:var(--accent)}
.sb-section{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:8px 10px 4px;display:flex;align-items:center;justify-content:space-between}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:14px;color:var(--ink-soft);font-weight:500;cursor:pointer;transition:background .15s,color .15s;user-select:none}
.sb-item:hover{background:var(--pu-50);color:var(--pu-600)}
.sb-item.active{background:var(--pu-500);color:#fff;font-weight:600}
.sb-item.active .sb-count{background:rgba(255,255,255,.2);color:#fff}
.sb-item svg{width:15px;height:15px;flex-shrink:0}
.sb-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-count{background:var(--pu-50);color:var(--pu-600);font-weight:700;font-size:11.5px;padding:2px 7px;border-radius:999px;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.sb-unit-name{flex:1;min-width:0;background:transparent;border:none;color:inherit;font-family:inherit;font-size:14px;font-weight:inherit;outline:none;cursor:pointer;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.sb-unit-name:focus{border-bottom:1px solid currentColor;cursor:text}
.sb-del{opacity:0;width:18px;height:18px;display:grid;place-items:center;border-radius:4px;flex-shrink:0;transition:opacity .15s}
.sb-item:hover .sb-del{opacity:.5}
.sb-del:hover{opacity:1 !important;background:rgba(163,25,25,.15);color:#a31919}
.sb-add{margin-top:4px;padding:9px 10px;border:1.5px dashed var(--pu-200);color:var(--pu-600);border-radius:8px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;transition:all .15s;background:transparent;cursor:pointer;width:100%}
.sb-add:hover{background:var(--pu-50);border-color:var(--pu-400);border-style:solid}
.sb-add svg{width:14px;height:14px}
.sb-divider{height:1px;background:var(--line);margin:8px 0}
.sb-action{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--ink-soft);font-weight:500;cursor:pointer;transition:background .15s;user-select:none;width:100%;text-align:left}
.sb-action:hover{background:var(--pu-50);color:var(--pu-600)}
.sb-action svg{width:14px;height:14px;flex-shrink:0}

/* Sidebar collapse — icon rail */
.sb-collapse-btn{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;cursor:pointer;color:var(--ink-faint);border:none;background:transparent;padding:0;flex-shrink:0;transition:color .15s,background .15s}
.sb-collapse-btn:hover{color:var(--pu-600);background:var(--pu-50)}
.sb-collapse-btn svg{transition:transform .22s ease}
@media(min-width:901px){
  .shell{transition:grid-template-columns .22s ease}
  .sidebar{overflow:hidden;transition:padding .22s ease}
  .sb-resizer{display:block}
  .shell.sidebar-collapsed{grid-template-columns:52px 1fr}
  .shell.sidebar-collapsed .sb-resizer{display:none}
  .shell.resizing{transition:none}
  .shell.resizing .sidebar{transition:none}
  .shell.sidebar-collapsed .sidebar{padding:16px 5px 8px}
  .shell.sidebar-collapsed .sb-collapse-btn svg{transform:rotate(180deg)}
  .shell.sidebar-collapsed .sb-label,
  .shell.sidebar-collapsed .sb-unit-name,
  .shell.sidebar-collapsed .sb-count,
  .shell.sidebar-collapsed .sb-del,
  .shell.sidebar-collapsed .drag-handle,
  .shell.sidebar-collapsed .sb-add-label{display:none}
  .shell.sidebar-collapsed .sb-item{justify-content:center;padding:9px 0}
  .shell.sidebar-collapsed .sb-action{justify-content:center;padding:8px 0}
  .shell.sidebar-collapsed .sb-add{justify-content:center;padding:9px 0;border-radius:8px}
  .shell.sidebar-collapsed .sb-section{display:none}
  .shell.sidebar-collapsed .sb-nav-section{display:flex;justify-content:center;padding:8px 0 4px}
  .shell.sidebar-collapsed .sb-nav-section>span{display:none}
  .shell.sidebar-collapsed .sb-divider{margin:4px 0}
}
/* Flyout panel (unit items, collapsed mode) */
.sb-unit-flyout{position:fixed;left:52px;z-index:300;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--pu-400);border-radius:0 8px 8px 0;padding:0 8px 0 10px;box-shadow:2px 4px 16px rgba(0,0,0,.12);min-width:190px;font-family:inherit}
.sb-unit-flyout .sb-unit-name{flex:1;min-width:100px;border:none;background:transparent;color:var(--ink);font-size:14px;font-weight:500;padding:4px 0;outline:none;cursor:pointer;font-family:inherit}
.sb-unit-flyout .sb-unit-name:focus{border-bottom:1px solid var(--pu-300);cursor:text}
.sb-unit-flyout .sb-del{opacity:.5}
.sb-unit-flyout .sb-del:hover{opacity:1 !important;background:rgba(163,25,25,.15);color:#a31919}
/* Custom tooltip (other items, collapsed mode) */
.sb-tip{position:fixed;left:60px;z-index:300;background:#1a1d2e;color:#fff;padding:4px 10px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;transform:translateY(-50%);box-shadow:0 2px 8px rgba(0,0,0,.2)}

/* ===== Main ===== */
.main{padding:20px 24px 80px;width:100%;overflow:auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:21.5px;margin:0;letter-spacing:-.02em;font-weight:700}
.page-head .sub{color:var(--ink-faint);font-size:14px;margin-top:3px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:all .15s;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn:hover{border-color:var(--pu-300);color:var(--pu-600);background:var(--pu-50)}
.btn.primary{background:var(--pu-600);color:#fff;border-color:var(--pu-600)}
.btn.primary:hover{background:var(--pu-700);border-color:var(--pu-700);color:#fff}
.btn.gold{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.btn.gold:hover{background:#b8943e;border-color:#b8943e}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--pu-50);border-color:var(--pu-100)}
.btn.danger{color:var(--danger);border-color:#f5d2d2}
.btn.danger:hover{background:var(--danger-bg);border-color:#e8a3a3}
.btn.save{background:#2563eb;color:#fff;border-color:#2563eb}
.btn.save:hover{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.btn.primary-outline{background:#fff;color:var(--pu-600);border-color:var(--pu-200)}
.btn.primary-outline:hover{background:var(--pu-50);border-color:var(--pu-300)}
.btn.slate{background:#475569;color:#fff;border-color:#475569}
.btn.slate:hover{background:#334155;border-color:#334155;color:#fff}
.btn svg{width:14px;height:14px}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:6px}
.btn-xs{padding:3px 8px;font-size:12px;border-radius:5px;gap:4px}
.btn-xs svg{width:11px;height:11px}
.icon-x{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:var(--ink-faint);cursor:pointer}
.icon-x:hover{background:var(--danger-bg);color:var(--danger)}
.icon-x svg{width:12px;height:12px}

/* ===== Cards ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card+.card{margin-top:16px}
.card-head{padding:13px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{font-weight:700;font-size:15px;letter-spacing:-.005em;display:flex;align-items:center;gap:10px}
.pill{background:var(--pu-50);color:var(--pu-700);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.pill.gold{background:var(--gold-bg);color:#856404}
.pill.gray{background:#f0f2f7;color:var(--ink-soft)}
.card-body{padding:16px 18px}

/* ===== Fields ===== */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--ink-faint);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.input,.select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s;font-size:14px;font-family:inherit}
.input:focus,.select:focus{outline:none;border-color:var(--pu-500);box-shadow:0 0 0 3px rgba(138,90,59,.16)}
.input.compact{padding:6px 9px;font-size:14px}
.input[type=number]{-moz-appearance:textfield;appearance:textfield}
.input[type=number]::-webkit-outer-spin-button,.input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* Custom qty stepper — full-height up/down buttons flush to the field edge */
.qtybox{position:relative;display:inline-flex;vertical-align:middle;align-self:flex-start;width:96px;flex:none}
.input.qty{width:96px;height:38px;box-sizing:border-box;text-align:left;padding:0 36px 0 12px;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.qtybox .qsteps{position:absolute;top:1px;right:1px;bottom:1px;width:28px;display:flex;flex-direction:column;border-left:1px solid var(--pu-100);border-radius:0 6px 6px 0;overflow:hidden}
.qtybox .qsteps button{flex:1;min-height:0;padding:0;border:0;background:#fff;color:var(--pu-600);cursor:pointer;display:flex;align-items:center;justify-content:center}
.qtybox .qsteps button+button{border-top:1px solid var(--pu-100)}
.qtybox .qsteps button:hover{background:var(--pu-50);color:var(--pu-800)}
.qtybox .qsteps button:active{background:var(--pu-100)}
.input.readonly{background:var(--panel);color:var(--ink-soft);cursor:default}
.input-search{padding-left:32px}
.search-icon-wrap{position:relative}
.search-icon-wrap .s-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none;width:14px;height:14px}
.handle-toggle{display:flex;gap:6px}
.handle-btn{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-soft);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
.handle-btn:hover:not(:disabled):not(.active){border-color:var(--pu-300);color:var(--pu-600)}
.handle-btn.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.handle-btn:disabled{opacity:.4;cursor:not-allowed}

/* ===== Meta grid ===== */
.meta-grid{display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr 2fr;gap:14px}

/* ===== Tabs ===== */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 14px;border-bottom:2.5px solid transparent;font-size:14px;font-weight:600;color:var(--ink-faint);cursor:pointer;white-space:nowrap;transition:all .15s;user-select:none}
.tab:hover{color:var(--pu-500)}
.tab.active{color:var(--pu-700);border-bottom-color:var(--pu-600)}
.tab-count{background:var(--line-soft);color:var(--ink-faint);font-size:11.5px;padding:1px 6px;border-radius:999px;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:700;margin-left:5px}
.tab.active .tab-count{background:var(--pu-100);color:var(--pu-700)}

/* ===== Add-item bar ===== */
.add-bar{background:var(--pu-50);border:1px solid var(--pu-100);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.add-bar .field label{color:var(--pu-700)}
.add-bar .input,.add-bar .select{border-color:var(--pu-100);background:#fff}
.add-bar .input:focus,.add-bar .select:focus{border-color:var(--pu-500)}
.add-bar .select,.add-bar .input,.add-bar .handle-btn,.add-bar .btn{min-height:38px;box-sizing:border-box}
.add-bar .ab-btns .btn:not(.primary){border-color:var(--pu-300);color:var(--pu-700)}
.add-bar .ab-btns .btn:not(.primary):hover{border-color:var(--pu-400);background:var(--pu-50);color:var(--pu-700)}

/* ===== Search dropdown ===== */
.search-picker{position:relative}
.search-results{position:fixed;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:9999;max-height:min(560px,70vh);overflow-y:auto;padding:5px;font-size:14px;min-width:320px}
.search-row{padding:9px 11px;border-radius:7px;cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:background .12s}
.search-row:hover,.search-row.kbd-hover{background:var(--pu-50)}
.search-row .row-main{flex:1;min-width:0}
.search-row .row-name{font-weight:600;font-size:15px;color:var(--ink)}
.search-row .row-meta{font-size:13.5px;color:var(--ink-faint);margin-top:3px;line-height:1.35}
.search-row .row-price{text-align:right;flex-shrink:0}
.search-row .row-price .price{font-weight:700;color:var(--pu-700);font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:13.5px}
.search-row .row-price .unit{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em}
.search-empty{padding:16px;text-align:center;color:var(--ink-faint);font-size:14px}
.search-row mark.s-hl{background:#F3D9A4;color:inherit;font-weight:700;border-radius:2px;padding:0 1px}

/* ===== BOM table ===== */
table.bom-table{width:100%;border-collapse:collapse;font-size:14px}
.bom-table thead th{text-align:left;font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding:9px 10px;border-bottom:1px solid var(--line);background:var(--pu-50)}
.bom-table thead th:first-child{padding-left:14px;border-radius:8px 0 0 0}
.bom-table thead th:last-child{padding-right:14px;border-radius:0 8px 0 0;text-align:right}
.bom-table tbody td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.bom-table tbody td:first-child{padding-left:14px}
.bom-table tbody td:last-child{padding-right:14px;text-align:right}
.bom-table tbody tr:hover{background:#faf8ff}
.bom-table tfoot td{padding:10px;font-weight:700;border-top:2px solid var(--pu-200);background:var(--pu-50)}
.bom-table tfoot td:first-child{padding-left:14px;border-radius:0 0 0 8px}
.bom-table tfoot td:last-child{padding-right:14px;border-radius:0 0 8px 0;text-align:right;color:var(--pu-700);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.col-no{width:36px;text-align:center;color:var(--ink-faint)}
.col-cat{width:110px}
.col-finish{width:170px}
.col-qty{width:80px;text-align:right}
.col-price{width:130px;text-align:right}
.col-total{width:150px;text-align:right}
.col-actions{width:122px;text-align:right}
.item-name{font-weight:600;color:var(--ink)}
.item-sub{font-size:12px;color:var(--ink-faint);margin-top:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.02em;background:var(--pu-50);color:var(--pu-700);margin-left:4px;vertical-align:middle}
.tag.custom{background:#fdf0ff;color:#7a1c8b}
.tag.alt{background:#e0f2fe;color:#0369a1}
.tag.gray{background:#f0f2f7;color:var(--ink-soft)}
.tag.buffer{background:color-mix(in srgb,var(--buffer) 12%,transparent);color:var(--buffer);border:1px solid color-mix(in srgb,var(--buffer) 38%,transparent);letter-spacing:.05em}
.tag.buffer.slot{visibility:hidden} /* reserved slot: keeps row height constant when buffer is toggled */
/* Category cell: stack the category tag + CUSTOM + BUFFER pills vertically */
.cat-stack{display:inline-flex;flex-direction:column;align-items:stretch;gap:3px}
.cat-stack .tag{margin-left:0;text-align:center;display:block}
/* Row actions — uniform segmented group (buffer / duplicate / delete), flush-joined like the qty stepper */
.row-actions{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface);flex-shrink:0}
.row-actions button{width:36px;height:34px;display:grid;place-items:center;border:0;background:transparent;cursor:pointer;transition:background .12s,color .12s;padding:0}
.row-actions button+button{border-left:1px solid var(--line)}
.row-actions button svg{width:16px;height:16px}
.row-actions .act-buf{color:color-mix(in srgb,var(--buffer) 70%,var(--ink-faint))}
.row-actions .act-buf:hover{background:color-mix(in srgb,var(--buffer) 12%,transparent);color:var(--buffer)}
.row-actions .act-buf.on{background:color-mix(in srgb,var(--buffer) 16%,transparent);color:var(--buffer)}
.row-actions .act-dup{color:color-mix(in srgb,var(--accent) 70%,var(--ink-faint))}
.row-actions .act-dup:hover{background:var(--pu-50);color:var(--pu-700)}
.row-actions .act-del{color:color-mix(in srgb,var(--danger) 62%,var(--ink-faint))}
.row-actions .act-del:hover{background:var(--danger-bg);color:var(--danger)}
.buffer-note{font-weight:600;font-size:12px;color:var(--buffer);margin-left:8px}
.notes-input{width:100%;border:1px solid transparent;padding:4px 6px;border-radius:5px;font-size:13px;font-family:inherit;color:var(--ink-faint);background:transparent;transition:border-color .15s}
.notes-input:hover{border-color:var(--line)}
.notes-input:focus{outline:none;border-color:var(--pu-300);background:#fff}
.editable-finish{cursor:pointer;display:flex;align-items:center;gap:4px}
.editable-finish:hover{color:var(--pu-600)}
.edit-pencil{opacity:0;width:12px;height:12px;color:var(--pu-400)}
.editable-finish:hover .edit-pencil{opacity:1}
.finish-val{font-size:13px;color:var(--ink-soft)}
.thickness-badge{font-size:11px;color:var(--ink-faint);background:var(--line-soft);padding:1px 5px;border-radius:3px;margin-left:4px;font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* ===== Stat row ===== */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .stat-label{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:5px}
.stat .stat-value{font-size:21.5px;font-weight:700;letter-spacing:-.02em;color:var(--ink);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.stat .stat-value .cur{font-size:12px;color:var(--ink-faint);font-weight:600;margin-right:3px;font-family:'Hanken Grotesk',sans-serif}
.stat .stat-sub{font-size:12px;color:var(--ink-faint);margin-top:3px}
.stat.accent{background:var(--sidebar);border-color:transparent}
.stat.accent .stat-label,.stat.accent .stat-sub{color:rgba(255,255,255,.7)}
.stat.accent .stat-value,.stat.accent .stat-value .cur{color:#fff}

/* ===== Summary / totals table ===== */
.matrix-table{width:100%;border-collapse:collapse;font-size:14px}
.matrix-table thead th{background:var(--sidebar);color:#fff;text-align:left;padding:11px 14px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.matrix-table thead th:last-child,.matrix-table thead th.num{text-align:right}
.matrix-table thead th:first-child{border-radius:8px 0 0 0}
.matrix-table thead th:last-child{border-radius:0 8px 0 0}
.matrix-table tbody td{padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.matrix-table tbody td.num,.matrix-table tbody td:last-child{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600}
.matrix-table tbody tr:hover{background:var(--pu-50)}
.matrix-table tfoot tr.sub td{background:var(--pu-50);font-weight:700;padding:11px 14px;border-top:1px solid var(--pu-200)}
.matrix-table tfoot tr.sub td.num,.matrix-table tfoot tr.sub td:last-child{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.matrix-table tfoot tr.grand td{background:var(--sidebar);color:#fff;font-size:16px;font-weight:800;padding:15px 14px}
.matrix-table tfoot tr.grand td.num,.matrix-table tfoot tr.grand td:last-child{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.matrix-table tfoot tr.grand td:first-child{border-radius:0 0 0 8px}
.matrix-table tfoot tr.grand td:last-child{border-radius:0 0 8px 0}

/* ===== Acc category pills ===== */
.cat-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cat-pill{padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-soft);background:white;cursor:pointer;transition:all .15s}
.cat-pill:hover{border-color:var(--pu-300);color:var(--pu-600)}
.cat-pill.active{background:var(--pu-600);color:#fff;border-color:var(--pu-600)}

/* ===== Modal ===== */
.modal-backdrop{position:fixed;inset:0;background:rgba(12,14,20,.5);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(2px);padding:18px}
.modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-head{padding:17px 22px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between}
.modal-head h2{margin:0;font-size:17.5px;font-weight:700;letter-spacing:-.01em}
.modal-body{padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.modal-foot{padding:13px 22px;border-top:1px solid var(--line-soft);display:flex;justify-content:flex-end;gap:8px}

/* ===== Toast ===== */
.toast-stack{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;animation:slideUp .22s ease-out;min-width:220px}
.toast.success{background:var(--good)}
.toast.warn{background:var(--warn)}
.toast.error{background:var(--danger)}
.toast svg{width:15px;height:15px;flex-shrink:0}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ===== Empty state ===== */
.empty-state{padding:32px;text-align:center;color:var(--ink-faint);font-size:14px}
.empty-state svg{width:36px;height:36px;margin-bottom:10px;opacity:.25}

/* ===== DB editor ===== */
.db-cat-select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:14px;margin-bottom:12px}
.db-items-wrap{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.db-item{display:flex;gap:8px;align-items:center}
.db-item input{flex:1;padding:5px 8px;border:1px solid var(--line);border-radius:5px;font-size:13px;font-family:inherit}
.db-item input.price-f{width:110px;flex:none;font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right}
.db-item .db-unit{font-size:12px;color:var(--ink-faint);min-width:24px}

/* ===== Helpers ===== */
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--ink-faint)}
.right{text-align:right}

/* ===== Responsive ===== */
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-280px;top:57px;bottom:0;width:280px;z-index:90;transition:left .25s;box-shadow:var(--shadow-lg)}
  .sidebar.open{left:0}
  .menu-btn{display:grid}
  .bom-table thead th{font-size:10.5px;padding:7px 7px}
  .bom-table tbody td{padding:8px 7px}
  .meta-grid{grid-template-columns:1fr 1fr}
  .stat-row{grid-template-columns:1fr 1fr}
  .col-finish{display:none}
}
@media(max-width:540px){
  .meta-grid{grid-template-columns:1fr}
  .stat-row{grid-template-columns:1fr}
  .main{padding:14px 14px 80px}
  .add-bar{gap:8px}
  .col-cat{display:none}
  .col-price{display:none}
}

/* ===== Print / PDF ===== */
@media print{
  @page{size:A4 portrait;margin:14mm 13mm}
  html,body{background:#fff!important;font-size:10.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .topbar,.sidebar,.menu-btn,.head-actions,.tabs,.add-bar,.cat-pills,.no-print,.modal-backdrop,.toast-stack,.col-actions,.col-drag,.col-check,.notes-input,.btn,.icon-x{display:none!important}
  .notes-print-val{display:inline!important;font-style:italic;color:#555}
  .shell{display:block!important}
  .main{padding:0!important;margin:0!important;overflow:visible!important}
  .card{box-shadow:none;border:1px solid #ddd;page-break-inside:auto;break-inside:auto}
  .bom-table{font-size:10px;page-break-inside:auto}
  .bom-table tr{page-break-inside:avoid}
  .bom-table thead th{background:#ede9fe!important;color:#4c1d95!important;font-size:9px}
  .bom-table tfoot td{background:#ede9fe!important}
  .stat-row,.meta-grid{display:grid!important;gap:8px}
  .stat{padding:8px 10px}
  .stat .stat-value{font-size:15px}
  #view-totals,#view-unit,#view-overview{display:none!important}
  #print-all-units{display:block!important}
  .print-unit-block{page-break-before:always;break-before:page;margin:0!important;border:none!important}
  .print-unit-block:first-child{page-break-before:auto;break-before:auto}
  .matrix-table thead th{background:#4c1d95!important;color:#fff!important}
  .matrix-table tfoot tr.grand td{background:#3b0764!important;color:#fff!important}
  .matrix-table tfoot tr.sub td{background:#f5f3ff!important}
  .print-header{display:flex!important;justify-content:space-between;align-items:flex-end;padding-bottom:12px;margin-bottom:16px;border-bottom:2px solid #4c1d95}
}
.print-header{display:none}
#print-all-units{display:none}

@media(max-width:700px){
  .add-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:12px}
  .ab-cat,.ab-finish,.ab-handle,.ab-thickness{min-width:0}
  .ab-cat{grid-column:1}.ab-finish{grid-column:2}
  .ab-handle{grid-column:1}.ab-thickness{grid-column:2}
  .ab-search{grid-column:1/-1}
  .ab-price{grid-column:1}.ab-qty{grid-column:2}
  .ab-btns{grid-column:1/-1;display:flex;gap:6px}
  .btn,.icon-btn,.icon-x{min-height:38px}
  .bom-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .bom-table-wrap .bom-table{min-width:680px}
}
@media(max-width:540px){
  .stat-row{grid-template-columns:1fr 1fr !important}
  .stat.accent{grid-column:1/-1}
  .meta-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){ .crumb,.rev-pill{display:none !important} }
@media(max-width:400px){ .meta-grid{grid-template-columns:1fr} }
.sb-overlay{display:none;position:fixed;inset:0;z-index:88;background:rgba(0,0,0,.35)}
.notes-print-val{display:none;font-style:italic;color:#888;font-size:11.5px}
@media(max-width:900px){
  .input,.select,.input.compact,.notes-input,.sb-unit-name{font-size:17.5px}
  .modal.modal-lg .modal-body{overflow-x:auto}
}
.sel-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--pu-75);border:1px solid var(--pu-200);border-radius:8px;margin-bottom:8px;flex-wrap:wrap}
.sel-bar .sel-count{font-size:14px;font-weight:600;color:var(--pu-700);flex:1;min-width:120px}
.sel-bar.hidden{display:none}
.col-check{width:36px;padding-left:10px !important;padding-right:4px !important;text-align:center}
.col-check input[type=checkbox]{width:15px;height:15px;accent-color:var(--pu-600);cursor:pointer;vertical-align:middle}
tr.row-sel td{background:var(--pu-50)}
.input.input-search{padding-left:34px}
.col-drag{width:22px;padding:0 4px !important;text-align:center;cursor:grab}
.col-drag:active{cursor:grabbing}
.drag-handle{cursor:grab;color:var(--ink-faint);display:inline-flex;align-items:center;padding:3px;border-radius:4px;flex-shrink:0}
.drag-handle:hover{color:var(--ink-soft);background:var(--pu-50)}
.drag-handle:active{cursor:grabbing}
tr.dragging{opacity:0.35}
tr.drop-above{box-shadow:inset 0 2px 0 var(--pu-500)}
tr.drop-below{box-shadow:inset 0 -2px 0 var(--pu-500)}
.sb-item.dragging{opacity:0.4}
.sb-item.drop-above{box-shadow:0 -2px 0 var(--pu-500)}
.sb-item.drop-below{box-shadow:0 2px 0 var(--pu-500)}
.pl-newer-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;background:#fef3c7;color:#92400e;border:1px solid #f59e0b;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
/* Large modal for DB editor */
.modal.modal-lg{max-width:min(980px,94vw);width:min(980px,94vw)}
.modal.modal-lg .modal-body{max-height:70vh;overflow-y:auto}
.db-item-row{padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;margin-bottom:4px;cursor:pointer;transition:background .12s,border-color .12s}
.db-item-row:hover{background:var(--pu-50);border-color:var(--pu-200)}

</style>
</head>
<body>

<!-- ===== TOPBAR ===== -->
<header class="topbar">
  <button class="menu-btn icon-btn" onclick="toggleSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="4" rx="1"/><rect x="13" y="19" width="8" height="2" rx="1"/>
      </svg>
    </div>
    <div class="brand-name">
      <strong>Stella Mobili BOQ</strong>
      <span>Costing System</span>
    </div>
  </div>
  <div class="crumb">
    <span>Projects</span>
    <span class="sep">/</span>
    <span id="crumb-project" class="muted">—</span>
    <span class="sep">/</span>
    <span class="here" id="crumb-view">Overview</span>
  </div>
  <div class="topbar-actions">
    <span class="dirty-flag" id="dirtyFlag" style="display:none"><span class="dirty-dot"></span>Unsaved edits</span>
    <span class="rev-pill alt-ver-chip" id="altVerChip" title="Alternative and version currently in the editor">Alt A · unsaved</span>
    <span class="rev-pill tool-ver-chip" id="toolVer" title="Tool version">v1.0.0</span>
    <span class="rev-pill" id="revPill" title="Price list version">v1</span>
    <div class="topbar-iconbtns">
      <button class="icon-btn" onclick="saveFile()" title="Save .smbq to disk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      </button>
      <button class="icon-btn" onclick="document.getElementById('loadInput').click()" title="Load .smbq from disk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon-btn" onclick="exportExcel()" title="Export to Excel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 14 12 9 7 14"/><line x1="12" y1="9" x2="12" y2="21"/></svg>
      </button>
    </div>
    <input type="file" id="loadInput" accept=".smbq,.json" style="display:none" onchange="loadFile(this)">
  </div>
</header>

<!-- ===== SHELL ===== -->
<div class="shell">

  <!-- Drag to resize the sidebar · double-click to reset -->
  <div class="sb-resizer" id="sb-resizer" title="Drag to resize · double-click to reset"></div>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-section sb-nav-section">
      <span>Navigation</span>
      <button class="sb-collapse-btn" onclick="toggleSidebarCollapse()" title="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <div class="sb-item active" onclick="showView('overview')" data-nav="overview" onmouseenter="showSbTip(this,'Overview')" onmouseleave="hideSbTip()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span class="sb-label">Overview</span>
    </div>
    <div class="sb-divider"></div>
    <div class="sb-section">
      Units
      <span class="sb-count" id="sb-unit-count">0</span>
    </div>
    <div id="sidebar-units"></div>
    <button class="sb-add" onclick="addUnit()" onmouseenter="showSbTip(this,'Add Unit / Room')" onmouseleave="hideSbTip()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span class="sb-add-label">Add Unit / Room</span>
    </button>

    <div style="flex:1"></div>
  </aside>
  <div class="sb-overlay" id="sb-overlay"></div>

  <!-- ===== MAIN ===== -->
  <main class="main" id="main-area">

    <!-- Print header (PDF only) -->
    <div class="print-header" id="print-header">
      <div>
        <div style="font-size:22px;font-weight:900;letter-spacing:2px;color:#4c1d95">MULYA</div>
        <div style="font-size:10px;color:#6c7080;margin-top:2px">PT. Mitra Usaha Lancar Jaya · Jl. Tegalsari 37 · More Value · More Possibilities</div>
        <div style="font-size:14px;font-weight:700;color:#c8a96e;margin-top:6px" id="ph-proj">—</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:14px;font-weight:700;color:#4c1d95">Stella Mobili</div>
        <div style="font-size:10px;color:#6c7080" id="ph-meta">BOQ · Showroom Price · v26.06.02</div>
      </div>
    </div>

    <!-- VIEW: Overview -->
    <section id="view-overview"></section>
    <!-- VIEW: Totals Matrix -->
    <section id="view-totals" class="hidden"></section>
    <!-- VIEW: Unit detail -->
    <section id="view-unit" class="hidden"></section>
    <!-- Print all units -->
    <section id="print-all-units"></section>

  </main>
</div>

<!-- Toast stack -->
<div class="toast-stack" id="toast-stack"></div>

<!-- Modal mount -->
<div id="modal-mount"></div>

<script>
/*__PRICE_DATA_INJECTION__*/

// ====================================================================
// STATE
// ====================================================================
let units = [], activeUnitId = null, unitCounter = 0;
let currentView = 'overview', currentSection = 'kitchen';
let selectedItems = {kit:null,wd:null,acc:null};
let searchPools = {kit:[],wd:[],acc:[]};
let revisionNumber = 1;
let customModalSection = 'kitchen';
let projectMeta = {name:'',client:'',pic:'',date:'',notes:'',priceListVersion:''};

// Drag-to-resize the sidebar. Width persists in localStorage and survives collapse/expand.
const SB_MIN_W=190, SB_MAX_W=460, SB_DEFAULT_W=260;
function setSidebarWidth(px){
  px=Math.max(SB_MIN_W,Math.min(SB_MAX_W,Math.round(px)));
  document.querySelector('.shell').style.setProperty('--sidebar-w', px+'px');
  return px;
}
function initSidebarResize(){
  const shell=document.querySelector('.shell');
  const resizer=document.getElementById('sb-resizer');
  if(!shell||!resizer) return;
  try{const s=parseInt(localStorage.getItem('sbWidth')); if(s) setSidebarWidth(s);}catch(e){}
  let dragging=false;
  const px=e=>(e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX);
  const onDown=e=>{
    if(window.innerWidth<=900 || shell.classList.contains('sidebar-collapsed')) return;
    dragging=true; resizer.classList.add('dragging'); shell.classList.add('resizing');
    document.body.style.userSelect='none'; document.body.style.cursor='col-resize';
    e.preventDefault();
  };
  const onMove=e=>{
    if(!dragging) return;
    setSidebarWidth(px(e)-shell.getBoundingClientRect().left);
    if(e.cancelable) e.preventDefault();
  };
  const onUp=()=>{
    if(!dragging) return;
    dragging=false; resizer.classList.remove('dragging'); shell.classList.remove('resizing');
    document.body.style.userSelect=''; document.body.style.cursor='';
    const w=parseInt(getComputedStyle(shell).getPropertyValue('--sidebar-w'))||SB_DEFAULT_W;
    try{localStorage.setItem('sbWidth', w);}catch(e){}
  };
  resizer.addEventListener('mousedown', onDown);
  resizer.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
  resizer.addEventListener('dblclick', ()=>{ setSidebarWidth(SB_DEFAULT_W); try{localStorage.setItem('sbWidth', SB_DEFAULT_W);}catch(e){} });
}
function toggleSidebarCollapse(){
  if(window.innerWidth<=900){return;}
  const collapsed=document.querySelector('.shell').classList.toggle('sidebar-collapsed');
  try{localStorage.setItem('sbCollapsed',collapsed?'1':'0');}catch(e){}
  hideUnitFlyout(0);hideSbTip();
}
let _sbFlyout=null,_sbFlyoutTimer=null,_sbTip=null,_sbTipTimer=null;
function showUnitFlyout(el,uid){
  if(!document.querySelector('.shell').classList.contains('sidebar-collapsed'))return;
  const u=units.find(u=>u.id===uid);if(!u)return;
  clearTimeout(_sbFlyoutTimer);
  if(_sbFlyout)_sbFlyout.remove();
  const rect=el.getBoundingClientRect();
  const fly=document.createElement('div');
  fly.className='sb-unit-flyout';
  fly.style.top=rect.top+'px';
  fly.style.height=rect.height+'px';
  fly.innerHTML=`<input class="sb-unit-name" type="text" value="${escAttr(u.name)}" onclick="event.stopPropagation()" onchange="renameUnit('${u.id}',this.value)">
    <button class="sb-del" onclick="event.stopPropagation();cloneUnit('${u.id}')" title="Clone unit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
    <button class="sb-del" onclick="event.stopPropagation();deleteUnit('${u.id}')" title="Delete unit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`;
  fly.addEventListener('mouseenter',()=>clearTimeout(_sbFlyoutTimer));
  fly.addEventListener('mouseleave',()=>hideUnitFlyout(0));
  document.body.appendChild(fly);
  _sbFlyout=fly;
}
function hideUnitFlyout(delay=0){
  clearTimeout(_sbFlyoutTimer);
  if(delay){_sbFlyoutTimer=setTimeout(()=>{if(_sbFlyout){_sbFlyout.remove();_sbFlyout=null;}},delay);}
  else{if(_sbFlyout){_sbFlyout.remove();_sbFlyout=null;}}
}
function showSbTip(el,text){
  if(!document.querySelector('.shell').classList.contains('sidebar-collapsed'))return;
  clearTimeout(_sbTipTimer);
  _sbTipTimer=setTimeout(()=>{
    hideSbTip();
    const rect=el.getBoundingClientRect();
    const tip=document.createElement('div');
    tip.className='sb-tip';
    tip.textContent=text;
    tip.style.top=(rect.top+rect.height/2)+'px';
    document.body.appendChild(tip);
    _sbTip=tip;
  },150);
}
function hideSbTip(){
  clearTimeout(_sbTipTimer);
  if(_sbTip){_sbTip.remove();_sbTip=null;}
}

function addUnit(name){
  unitCounter++;
  const id = 'u'+unitCounter;
  units.push({id, name: name||'Unit '+unitCounter, items:{kitchen:[],wardrobe:[],accessories:[]}});
  if(!activeUnitId) activeUnitId = id;
  markDirty();
  renderSidebarUnits();
  if(currentView==='overview') renderOverview();
  if(window.innerWidth<=900){
    document.getElementById('sidebar').classList.remove('open');
    const ov=document.getElementById('sb-overlay');
    if(ov) ov.style.display='none';
  }
}
function deleteUnit(id){
  if(units.length<=1){toast('Need at least one unit.','warn');return}
  if(!confirm('Delete this unit and all its items?')) return;
  units = units.filter(u=>u.id!==id);
  if(activeUnitId===id) activeUnitId = units[0].id;
  markDirty();
  renderSidebarUnits();
  showView('overview');
}
function cloneUnit(id){
  const src=units.find(u=>u.id===id); if(!src) return;
  unitCounter++;
  const newId='u'+unitCounter;
  const cloned=JSON.parse(JSON.stringify(src));
  cloned.id=newId; cloned.name=src.name+' (copy)';
  ['kitchen','wardrobe','accessories'].forEach(sec=>{
    cloned.items[sec].forEach(r=>{ r.id=Date.now()+Math.random(); });
  });
  const srcIdx=units.findIndex(u=>u.id===id);
  units.splice(srcIdx+1,0,cloned);
  markDirty();
  renderSidebarUnits();
  if(currentView==='overview') renderOverview();
  toast('Cloned: '+cloned.name);
}
function renameUnit(id,val){const u=units.find(u=>u.id===id);if(u){u.name=val;markDirty();renderSidebarUnits();if(currentView!=='unit') renderOverview();}}
function getUnit(id){return units.find(u=>u.id===(id||activeUnitId))}
function unitTotal(u){return['kitchen','wardrobe','accessories'].reduce((s,sec)=>s+u.items[sec].reduce((ss,r)=>ss+r.price*r.qty,0),0)}
function secTotal(u,sec){return u.items[sec].reduce((s,r)=>s+r.price*r.qty,0)}
// Buffer = insurance/extra stock: still counted in the BOQ totals, but flagged so it can be
// excluded from the Sales Order downstream. These sum only the buffer-marked rows.
function secBufferTotal(u,sec){return u.items[sec].filter(r=>r.buffer===true).reduce((s,r)=>s+r.price*r.qty,0)}
function unitBufferTotal(u){return['kitchen','wardrobe','accessories'].reduce((s,sec)=>s+secBufferTotal(u,sec),0)}

      <div class="stat accent"><div class="stat-label">Unit Total</div><div class="stat-value"><span class="cur">Rp</span><span id="sv-unit-total">${Math.round(kit+wd+acc).toLocaleString('id-ID')}</span></div><div class="stat-sub" id="ss-unit-total">${(()=>{const b=unitBufferTotal(unit);return b>0?'incl. buffer '+fmt(b):'all sections';})()}</div></div>
    </div>
    <div class="tabs" id="unit-tabs">
      <div class="tab active" onclick="switchTab('kitchen',this)">Kitchen <span class="tab-count" id="tc-kitchen">${unit.items.kitchen.length}</span></div>
      <div class="tab" onclick="switchTab('wardrobe',this)">Wardrobe <span class="tab-count" id="tc-wardrobe">${unit.items.wardrobe.length}</span></div>
      <div class="tab" onclick="switchTab('accessories',this)">Accessories <span class="tab-count" id="tc-accessories">${unit.items.accessories.length}</span></div>
    </div>
    <div id="tab-content"></div>`;
  switchTab('kitchen', e.querySelector('.tab'));
}

let currentTab = 'kitchen';
function switchTab(sec, btn){
  currentTab = sec;
  document.querySelectorAll('#unit-tabs .tab').forEach(t=>t.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderTabContent(sec);
}
function renderTabContent(sec){
  const unit = getUnit(); if(!unit) return;
  const wrap = document.getElementById('tab-content'); if(!wrap) return;
  wrap.innerHTML = buildAddBar(sec) + `<div id="tab-table">` + buildTableCard(unit, sec) + `</div>`;
  initSearchInput(sec);
  updateUnitStats();
}
// Rebuild ONLY the items table, leaving the Add Bar (category/finish/handle) untouched.
// Used by row mutations so the PIC's current selections stay put, ready for the next item.
function refreshTable(sec){
  const unit = getUnit(); if(!unit) return;
  const tt = document.getElementById('tab-table');
  if(tt) tt.innerHTML = buildTableCard(unit, sec);
  else renderTabContent(sec);
  updateUnitStats();
}
function updateUnitStats(){
  const unit=getUnit(); if(!unit) return;
  const kit=secTotal(unit,'kitchen'), wd=secTotal(unit,'wardrobe'), acc=secTotal(unit,'accessories');
  const v={'sv-kitchen':kit,'sv-wardrobe':wd,'sv-accessories':acc,'sv-unit-total':kit+wd+acc};
  const s={'ss-kitchen':unit.items.kitchen.length,'ss-wardrobe':unit.items.wardrobe.length,'ss-accessories':unit.items.accessories.length};
  for(const [id,n] of Object.entries(v)){const e=document.getElementById(id);if(e)e.textContent=Math.round(n).toLocaleString('id-ID');}
  for(const [id,n] of Object.entries(s)){const e=document.getElementById(id);if(e)e.textContent=n+' item'+(n===1?'':'s');}
  const bufEl=document.getElementById('ss-unit-total');
  if(bufEl){const b=unitBufferTotal(unit);bufEl.textContent=b>0?'incl. buffer '+fmt(b):'all sections';}
}

// ====================================================================
// KITCHEN FINISHES
// ====================================================================
function detectThickness(f){
  const m = String(f).match(/(\d+)\s*mm/i);
  return m ? m[1]+'mm' : '';
}
function initKitFinishes(){
  const cat = el('kit-cat')?.value; if(!cat) return;
  const items = getPD().kitchen[cat]||[];
  const fs = new Set();
  items.forEach(it => Object.keys(it.prices).forEach(k => {
    const finish = k.split('__')[0];
    if(finish && finish !== '(No Finish)') fs.add(finish);
  }));
  const hasNoFinish = items.some(it => Object.keys(it.prices).some(k => k.startsWith('(No Finish)')));
  if(hasNoFinish && fs.size === 0) fs.add('(No Finish)');
  const sel = el('kit-finish'); if(!sel) return;
  const cur = sel.value;
  sel.innerHTML = [...fs].sort().map(f=>`<option${f===cur?' selected':''}>${esc(f)}</option>`).join('');
}
function updateHandleVisibility(){
  const cat = el('kit-cat')?.value||'';
  const hf = el('kit-handle-field');
  if(hf) hf.style.display = NO_HANDLE_CATS.has(cat) ? 'none' : '';
}
function onKitCatChange(){ initKitFinishes(); updateHandleVisibility(); onKitFinishChange(); clearSearch('kit'); }
function onKitFinishChange(){
  const f = el('kit-finish')?.value||'';
  if(el('kit-thickness')) el('kit-thickness').value = detectThickness(f);
  refreshKitHandle();
  clearSearch('kit');
}
function kitGolaAvailable(){
  const c = el('kit-cat')?.value||'', f = el('kit-finish')?.value||'';
  if(NO_HANDLE_CATS.has(c)) return false;
  return (getPD().kitchen[c]||[]).some(it=>(f+'__gola') in it.prices);
}
// Enable/disable the Gola button for the current category+finish; reset to Standard if Gola is no longer valid.
function refreshKitHandle(){
  const golaBtn = el('kit-handle-gola'); if(!golaBtn) return;
  const avail = kitGolaAvailable();
  golaBtn.disabled = !avail;
  golaBtn.title = avail ? 'Gola handle' : 'Gola not available for this category / finish';
  if(!avail && (el('kit-variant')?.value==='gola')) setKitVariant('standard', true);
}
// Toggle the Standard/Gola handle. Keeps the hidden #kit-variant input in sync (all pricing code reads that).
function setKitVariant(v, skipSearch){
  if(v==='gola' && el('kit-handle-gola')?.disabled) return;
  const inp = el('kit-variant'); if(inp) inp.value = v;
  const sb = el('kit-handle-standard'), gb = el('kit-handle-gola');
  if(sb) sb.classList.toggle('active', v==='standard');
  if(gb) gb.classList.toggle('active', v==='gola');
  if(!skipSearch) clearSearch('kit');
}

// WARDROBE FINISHES
// ====================================================================
function onWdCatChange(){
  const cat = el('wd-cat')?.value||'';
  const isGlass  = WD_GLASS_CATS.has(cat);
  const isNoFin  = WD_NOFIN_CATS.has(cat);
  const isFinish = !isGlass && !isNoFin;
  el('wd-finish-field').style.display   = isFinish ? '' : 'none';
  el('wd-glass-field').style.display    = isGlass  ? '' : 'none';
  el('wd-glass2-field').style.display   = isGlass  ? '' : 'none';
  el('wd-thickness-field').style.display = isNoFin  ? 'none' : '';
  if(isFinish) initWdFinishes();
  if(isGlass)  initWdGlass();
  clearSearch('wd');
}
function initWdFinishes(){
  const cat = el('wd-cat')?.value; if(!cat) return;
  const items = getPD().wardrobe[cat]||[];
  const fs = new Set();
  items.forEach(it => Object.keys(it.prices).forEach(k => {
    const f = k.split('__')[0];
    if(f && f !== '(No Finish)') fs.add(f);
  }));
  const sel = el('wd-finish'); if(!sel) return;
  const cur = sel.value;
  sel.innerHTML = [...fs].sort().map(f=>`<option${f===cur?' selected':''}>${esc(f)}</option>`).join('');
  onWdFinishChange();
}
function onWdFinishChange(){
  const cat = el('wd-cat')?.value||'';
  const f   = el('wd-finish')?.value||'';
  if(el('wd-thickness')) el('wd-thickness').value = detectWdThickness(cat, f);
  clearSearch('wd');
}
function detectWdThickness(cat, finish){
  const items = getPD().wardrobe[cat]||[];
  const key = finish + '__standard';
  for(const it of items){
    if(it.thicknesses && it.thicknesses[key]) return it.thicknesses[key];
  }
  return detectThickness(finish);
}
function initWdGlass(){
  const cat = el('wd-cat')?.value; if(!cat) return;
  const items = getPD().wardrobe[cat]||[];
  const glassSet = new Set();
  items.forEach(it => Object.keys(it.prices).forEach(k => {
    const parts = k.split(' | '); if(parts.length >= 2) glassSet.add(parts[0]);
  }));
  const sel = el('wd-glass'); if(sel) sel.innerHTML = [...glassSet].sort().map(g=>`<option>${esc(g)}</option>`).join('');
  const lbl = el('wd-glass2-label');
  if(lbl) lbl.textContent = cat === 'Sliding Glass Door' ? 'Frame Type' : 'Hinge Type';
  onWdGlassChange();
}
function onWdGlassChange(){
  const cat   = el('wd-cat')?.value;
  const glass = el('wd-glass')?.value;
  const items = getPD().wardrobe[cat]||[];
  const t2Set = new Set();
  items.forEach(it => Object.keys(it.prices).forEach(k => {
    const parts = k.split(' | ');
    if(parts[0] === glass && parts.length >= 2) t2Set.add(parts[1].replace('__standard',''));
  }));
  const sel2 = el('wd-glass2'); if(sel2) sel2.innerHTML = [...t2Set].sort().map(t=>`<option>${esc(t)}</option>`).join('');
  clearSearch('wd');
}

// ACCESSORIES CATEGORY
// ====================================================================
function onAccCatChange(){ clearSearch('acc'); }

// ====================================================================
// SEARCH
// ====================================================================
function getPool(p){
  if(p==='kit'){
    const c=el('kit-cat')?.value, f=el('kit-finish')?.value, v=el('kit-variant')?.value||'standard';
    return (getPD().kitchen[c]||[]).filter(it=>{
      const keys=Object.keys(it.prices);
      if(keys.every(k=>k.startsWith('(No Finish)'))) return true;
      if(v==='gola') return (f+'__gola') in it.prices;
      return (f+'__standard') in it.prices;
    });
  }
  if(p==='wd'){
    const c=el('wd-cat')?.value||'';
    if(!c) return [];
    const items=getPD().wardrobe[c]||[];
    if(WD_NOFIN_CATS.has(c)) return items;
    if(WD_GLASS_CATS.has(c)){
      const glass=el('wd-glass')?.value, t2=el('wd-glass2')?.value;
      if(!glass) return items;
      const priceKey=`${glass} | ${t2}__standard`;
      return items.filter(it=>priceKey in it.prices);
    }
    const f=el('wd-finish')?.value||'';
    if(!f) return items;
    return items.filter(it=>(f+'__standard') in it.prices);
  }
  if(p==='acc'){
    const c=el('acc-cat')?.value||'';
    return getPD().accessories[c]||[];
  }
  return [];
}

function onSearchFocus(p){ if(!(el(p+'-search')?.value)) showDropdown(p, getPool(p)); }
function onSearch(p){
  const q=(el(p+'-search')?.value||'').toLowerCase();
  const pool=getPool(p);
  const tokens=q?q.split(/\s+/).filter(Boolean):[];
  // No result cap — show every match so the user never misses an item they're searching for.
  // Search across all shown lines (desc + category + dims + notes), not just the description.
  showDropdown(p, tokens.length ? pool.filter(it=>{const h=itemHay(it);return tokens.every(t=>h.includes(t));}) : pool);
}

// Shared dimension formatter — labelled W/H/D so it's unambiguous everywhere it appears.
function fmtDims(o, opts){
  const suf=(opts&&opts.mm)?' mm':'';
  if(o.w&&o.h&&o.d) return `W ${o.w} × H ${o.h} × D ${o.d}${suf}`;
  if(o.depth)       return `D ${o.depth}${suf}`;
  if(o.d)           return `D ${o.d}${suf}`;
  return '';
}
// Lowercased haystack of every searchable field (raw values, no W/H/D labels).
function itemHay(it){
  return [it.desc,it.subcat,it.w,it.h,it.d,it.depth,it.thickness_mm,it.depth_mm,it.notes,it.code]
    .filter(v=>v!=null&&v!=='').join(' ').toLowerCase();
}
// esc() then wrap each search token in <mark> for Google-style highlighting.
function hlEsc(text, tokens){
  let e=esc(text);
  if(tokens&&tokens.length){
    const pat=tokens.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).filter(Boolean).join('|');
    if(pat) e=e.replace(new RegExp('('+pat+')','gi'),'<mark class="s-hl">$1</mark>');
  }
  return e;
}

// Enter in the search field adds the item (like Enter in the qty field). If the
// dropdown is open with results, confirm the top match first; otherwise add the
// already-selected item (addRow warns if nothing is selected).
function searchEnter(p, sec){
  const res=el(p+'-results');
  const open=res && !res.classList.contains('hidden');
  if(open){
    const pool=searchPools[p]||[];
    if(!pool.length) return;      // "No items found" — nothing to add
    selectItem(p, 0);             // confirm the top result
  }
  addRow(sec);
}

function showDropdown(p, items){
  const resEl=el(p+'-results'); if(!resEl) return;
  searchPools[p]=items;
  if(!items.length){ resEl.innerHTML=`<div class="search-empty">No items found</div>`; positionDropdown(p); resEl.classList.remove('hidden'); return; }
  const q=(el(p+'-search')?.value||'').toLowerCase();
  const tokens=q?q.split(/\s+/).filter(Boolean):[];
  resEl.innerHTML = items.map((it,i)=>{
    let price='', unit='set', meta='';
    if(p==='kit'){
      const f=el('kit-finish')?.value, v=el('kit-variant')?.value||'standard';
      const isNoFinish=Object.keys(it.prices).every(k=>k.startsWith('(No Finish)'));
      const pr=isNoFinish?(it.prices['(No Finish)__standard']||0):(it.prices[f+'__'+v]||it.prices[f+'__standard']||0);
      price=pr?fmtNum(pr):'—'; unit=it.unit||'set';
      const dims=fmtDims(it);
      meta=[it.subcat,dims].filter(Boolean).join(' · ');
    } else if(p==='wd'){
      const c=el('wd-cat')?.value||'';
      let priceKey;
      if(WD_NOFIN_CATS.has(c)) priceKey='(No Finish)__standard';
      else if(WD_GLASS_CATS.has(c)){ const g=el('wd-glass')?.value, t2=el('wd-glass2')?.value; priceKey=`${g} | ${t2}__standard`; }
      else priceKey=(el('wd-finish')?.value||'')+'__standard';
      const pr=it.prices[priceKey]||0;
      price=pr?fmtNum(pr):'—'; unit=it.unit||'set';
      const dims=fmtDims(it);
      meta=[it.subcat,dims].filter(Boolean).join(' · ');
    } else if(p==='acc'){
      const pr=it.prices['(No Finish)__standard']||0;
      price=pr?fmtNum(pr):'—'; unit=it.unit||'pcs';
      const extra=it.code?`#${it.code}`:(it.thickness_mm?`${it.thickness_mm}mm`:'');
      meta=[it.subcat,extra].filter(Boolean).join(' · ');
    }
    const notes = it.notes||'';
    return `<div class="search-row" data-idx="${i}" data-p="${p}">
      <div class="row-main">
        <div class="row-name">${hlEsc(it.desc,tokens)}</div>
        ${meta?`<div class="row-meta">${hlEsc(meta,tokens)}</div>`:''}
        ${notes?`<div class="row-meta" style="color:var(--pu-500);font-style:italic">${hlEsc(notes,tokens)}</div>`:''}
      </div>
      <div class="row-price"><div class="price">Rp ${price}</div><div class="unit">${esc(unit)}</div></div>
    </div>`;
  }).join('');
  resEl.querySelectorAll('.search-row[data-idx]').forEach(r=>r.addEventListener('mousedown',function(e){e.preventDefault();selectItem(this.getAttribute('data-p'),+this.getAttribute('data-idx'));}));
  positionDropdown(p); resEl.classList.remove('hidden');
}

function positionDropdown(p){
  const inp=el(p+'-search'), res=el(p+'-results'); if(!inp||!res) return;
  const rect=inp.getBoundingClientRect();
  res.style.top=(rect.bottom+window.scrollY+4)+'px';
  res.style.left=(rect.left+window.scrollX)+'px';
  res.style.width=Math.max(rect.width,320)+'px';
}
function hideDropdown(p){ const r=el(p+'-results'); if(r) r.classList.add('hidden'); }

function selectItem(p, idx){
  const it=searchPools[p][idx]; if(!it) return;
  selectedItems[p]=it;
  if(el(p+'-search')) el(p+'-search').value=it.desc;
  hideDropdown(p);
  let price=0;
  if(p==='kit'){
    const f=el('kit-finish')?.value, v=el('kit-variant')?.value||'standard';
    const isNoFinish=Object.keys(it.prices).every(k=>k.startsWith('(No Finish)'));
    price=isNoFinish?(it.prices['(No Finish)__standard']||0):(it.prices[f+'__'+v]||it.prices[f+'__standard']||0);
  } else if(p==='wd'){
    const c=el('wd-cat')?.value||'';
    if(WD_NOFIN_CATS.has(c)) price=it.prices['(No Finish)__standard']||0;
    else if(WD_GLASS_CATS.has(c)){ const g=el('wd-glass')?.value, t2=el('wd-glass2')?.value; price=it.prices[`${g} | ${t2}__standard`]||0; }
    else { const f=el('wd-finish')?.value||''; price=it.prices[f+'__standard']||0; }
  } else if(p==='acc'){
    price=it.prices['(No Finish)__standard']||0;
  }
  const prev=el(p+'-preview'); if(prev) prev.textContent=price?('Rp '+fmtNum(price)):'—';
}

function clearSearch(p){
  const inp=el(p+'-search'); if(inp) inp.value='';
  selectedItems[p]=null;
  const prev=el(p+'-preview'); if(prev) prev.textContent='—';
  hideDropdown(p);
}
function globalClickClose(e){
  ['kit','wd','acc'].forEach(p=>{
    const inp=el(p+'-search'), res=el(p+'-results');
    if(inp&&res&&!inp.contains(e.target)&&!res.contains(e.target)) hideDropdown(p);
  });
}

// ====================================================================
// ADD ROW
// ====================================================================
function addRow(sec){
  const unit=getUnit(); if(!unit) return;
  const pm={kitchen:'kit',wardrobe:'wd',accessories:'acc'};
  const p=pm[sec]; const it=selectedItems[p];
  if(!it){toast('Please select an item first','warn');return;}
  const qty=Math.round(parseFloat(el(p+'-qty')?.value)*10)/10||1;
  let price=0, finish='', variant='', category='', thickness='', subcat='', unit_str='set', w=null, h=null, d=null;

  if(sec==='kitchen'){
    category=el('kit-cat').value;
    const f=el('kit-finish').value;
    variant=NO_HANDLE_CATS.has(category)?'':(el('kit-variant').value||'standard');
    const kitTKey=f+'__'+(variant||'standard');
    thickness=(it.thicknesses&&it.thicknesses[kitTKey])?it.thicknesses[kitTKey]:detectThickness(f);
    subcat=it.subcat||''; w=it.w||null; h=it.h||null; d=it.d||null; unit_str=it.unit||'set';
    const isNoFinish=Object.keys(it.prices).every(k=>k.startsWith('(No Finish)'));
    if(isNoFinish){ finish='(No Finish)'; price=it.prices['(No Finish)__standard']||0; variant=''; }
    else{
      finish=f;
      const check=validateGola(it,finish,variant||'standard');
      if(!check.ok){toast(check.reason,'error',5000);return;}
      price=it.prices[finish+'__'+(variant||'standard')]||it.prices[finish+'__standard']||0;
    }
  } else if(sec==='wardrobe'){
    category=el('wd-cat').value;
    subcat=it.subcat||''; w=it.w||null; h=it.h||null; d=it.d||null; unit_str=it.unit||'set';
    if(WD_NOFIN_CATS.has(category)){
      finish='(No Finish)'; variant=''; thickness=it.thickness||'';
      price=it.prices['(No Finish)__standard']||0;
    } else if(WD_GLASS_CATS.has(category)){
      const glass=el('wd-glass').value, t2=el('wd-glass2').value;
      finish=glass+' | '+t2; variant=''; thickness='';
      price=it.prices[finish+'__standard']||0;
    } else {
      const f=el('wd-finish').value; finish=f; variant='';
      const fKey=f+'__standard';
      thickness=(it.thicknesses&&it.thicknesses[fKey])?it.thicknesses[fKey]:detectThickness(f);
      price=it.prices[fKey]||0;
    }
  } else if(sec==='accessories'){
    category=el('acc-cat').value;
    subcat=it.subcat||''; finish='(No Finish)'; variant=''; thickness=''; unit_str=it.unit||'pcs';
    price=it.prices['(No Finish)__standard']||0;
  }

  unit.items[sec].push({
    id:Date.now()+Math.random(), category, subcat, desc:it.desc,
    finish, variant, thickness, unit:unit_str, w, h, d, qty, price, notes:'', custom:false, altGroup:null, buffer:false
  });
  markDirty();
  // Keep the Add Bar selections (category / finish / handle) intact — only refresh the
  // table and clear the search, ready for the PIC to add the next item of the same type.
  refreshTable(sec); updateTabCounts(); renderSidebarUnits();
  toast('Item added');
  if(el(p+'-search')) el(p+'-search').value='';
  if(el(p+'-qty')) el(p+'-qty').value=1;
  if(el(p+'-preview')) el(p+'-preview').textContent='—';
  selectedItems[p]=null;
  el(p+'-search')?.focus();
}

function validateGola(item, finish, variant){
  if(variant!=='gola') return{ok:true};
  if(item.prices&&!(finish+'__gola' in item.prices)) return{ok:false,reason:`"${item.desc}" with finish "${finish}" does not support Gola handle.`};
  return{ok:true};
}
function updateTabCounts(){
  const unit=getUnit(); if(!unit) return;
  ['kitchen','wardrobe','accessories'].forEach(s=>{const e=document.getElementById('tc-'+s);if(e)e.textContent=unit.items[s].length;});
}

// ====================================================================
function editFinish(cell, sec, id){
  const unit=getUnit(); if(!unit) return;
  const row=unit.items[sec].find(r=>r.id==id); if(!row) return;
  if(row.finish==='(No Finish)'){toast('This item has no finish variants.','warn');return;}
  let opts=[];
  if(sec==='kitchen'){
    const catItems=getPD().kitchen[row.category]||[];
    const descItem=catItems.find(it=>it.desc===row.desc);
    if(descItem) Object.keys(descItem.prices).forEach(k=>{
      const i=k.lastIndexOf('__'); const f=k.slice(0,i); const v=k.slice(i+2);
      if(!opts.find(o=>o.key===k)) opts.push({key:k, label:f+(v&&v!=='standard'?' / '+v:''), price:descItem.prices[k]});
    });
  } else if(sec==='wardrobe'){
    const catItems=getPD().wardrobe[row.category]||[];
    const descItem=catItems.find(it=>it.desc===row.desc);
    if(descItem) Object.keys(descItem.prices).forEach(k=>{
      const finKey=k.replace('__standard','');
      if(!opts.find(o=>o.key===finKey)) opts.push({key:finKey, label:finKey, price:descItem.prices[k]});
    });
  }
  if(!opts.length){toast('No alternative finishes available for this item.','warn');return;}
  const curKey = sec==='kitchen'?(row.finish+'__'+(row.variant||'standard')):row.finish;
  showModal(`<div class="modal-head"><h2>Change Finish</h2><button class="icon-x" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body">
    <p style="font-size:12px;color:var(--ink-faint);margin-bottom:10px">${esc(row.desc)}</p>
    <div class="field"><label>Finish / Handle</label>
      <select class="select" id="ef-sel">
        ${opts.map(o=>`<option value="${escAttr(o.key)}"${o.key===curKey?' selected':''}>${esc(o.label)} — Rp ${fmtNum(o.price)}</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="commitFinish('${sec}','${id}')">Apply</button></div>`);
}

function commitFinish(sec,id){
  const unit=getUnit(); if(!unit) return;
  const row=unit.items[sec].find(r=>r.id==id); if(!row) return;
  const val=el('ef-sel')?.value; if(!val) return;
  if(sec==='kitchen'){
    const i=val.lastIndexOf('__'); const f=val.slice(0,i); const v=val.slice(i+2);
    const catItems=getPD().kitchen[row.category]||[];
    const descItem=catItems.find(it=>it.desc===row.desc);
    const check=validateGola({prices:descItem?descItem.prices:{}},f,v);
    if(!check.ok){toast(check.reason,'error',5000);return;}
    row.finish=f; row.variant=v; row.thickness=detectThickness(f);
    if(descItem) row.price=descItem.prices[val]||row.price;
  } else if(sec==='wardrobe'){
    const catItems=getPD().wardrobe[row.category]||[];
    const descItem=catItems.find(it=>it.desc===row.desc);
    row.finish=val; row.variant='';
    if(descItem){
      row.price=descItem.prices[val+'__standard']||row.price;
      if(descItem.thicknesses&&descItem.thicknesses[val+'__standard']) row.thickness=descItem.thicknesses[val+'__standard'];
      else row.thickness=WD_GLASS_CATS.has(row.category)?'':detectThickness(val);
    }
  }
  markDirty();
  closeModal(); refreshTable(sec);
}

function updateQty(sec,id,val){const unit=getUnit();if(!unit)return;const r=unit.items[sec].find(r=>r.id==id);if(r){r.qty=Math.round(parseFloat(val)*10)/10||1;markDirty();refreshTable(sec);}}
function updateNotes(sec,id,val){const unit=getUnit();if(!unit)return;const r=unit.items[sec].find(r=>r.id==id);if(r){r.notes=val;markDirty();}}
function toggleRowBuffer(sec,id){const unit=getUnit();if(!unit)return;const r=unit.items[sec].find(r=>r.id==id);if(!r)return;r.buffer=r.buffer===true?false:true;markDirty();refreshTable(sec);toast(r.buffer?'Marked as buffer':'Buffer removed');}
function removeRow(sec,id){const unit=getUnit();if(!unit)return;unit.items[sec]=unit.items[sec].filter(r=>r.id!=id);selectedRows[sec].delete(String(id));markDirty();refreshTable(sec);updateTabCounts();renderSidebarUnits();}
function duplicateRow(sec,id){
  const unit=getUnit();if(!unit)return;
  const row=unit.items[sec].find(r=>r.id==id);if(!row)return;
  const n=JSON.parse(JSON.stringify(row));n.id=Date.now()+Math.random();n.altGroup=null;
  const idx=unit.items[sec].indexOf(row);unit.items[sec].splice(idx+1,0,n);
  markDirty();
  refreshTable(sec);updateTabCounts();renderSidebarUnits();toast('Row duplicated');
}
function toggleRowSelect(sec,id,checked){
  if(checked) selectedRows[sec].add(String(id)); else selectedRows[sec].delete(String(id));
  updateSelectionUI(sec);
}
function toggleAllRows(sec,checked){
  const unit=getUnit();if(!unit)return;
  if(checked) unit.items[sec].forEach(r=>selectedRows[sec].add(String(r.id)));
  else selectedRows[sec].clear();
  updateSelectionUI(sec);
}
function updateSelectionUI(sec){
  const unit=getUnit();if(!unit)return;
  const count=selectedRows[sec].size;
  const bar=document.getElementById('sel-bar-'+sec);
  if(bar){ bar.classList.toggle('hidden',count===0); const ct=bar.querySelector('.sel-count'); if(ct) ct.textContent=count+' item'+(count===1?'':'s')+' selected'; }
  unit.items[sec].forEach(r=>{
    const tr=document.querySelector(`tr[data-id="${r.id}"]`);
    if(tr){ const sel=selectedRows[sec].has(String(r.id)); tr.classList.toggle('row-sel',sel); const cb=tr.querySelector('input[type=checkbox]');if(cb)cb.checked=sel; }
  });
  const all=document.getElementById('sel-all-'+sec);
  if(all){ all.checked=count>0&&count===unit.items[sec].length; all.indeterminate=count>0&&count<unit.items[sec].length; }
}
function clearSelection(sec){ selectedRows[sec].clear(); updateSelectionUI(sec); }
function deleteSelected(sec){
  const unit=getUnit();if(!unit)return;
  const ids=selectedRows[sec];if(!ids.size)return;
  if(!confirm(`Delete ${ids.size} selected item${ids.size===1?'':'s'}?`))return;
  unit.items[sec]=unit.items[sec].filter(r=>!ids.has(String(r.id)));
  selectedRows[sec].clear();
  markDirty();
  refreshTable(sec);updateTabCounts();renderSidebarUnits();
  toast(ids.size+' item'+(ids.size===1?'':'s')+' deleted');
}
function showCopyToUnit(sec){
  const ids=selectedRows[sec];if(!ids.size){toast('No items selected','warn');return;}
  const unit=getUnit();
  const others=units.filter(u=>u.id!==unit.id);
  if(!others.length){toast('No other units available','warn');return;}
  const opts=others.map(u=>`<div class="db-item-row" onclick="copyToUnit('${sec}','${u.id}');closeModal()">${esc(u.name)}</div>`).join('');
  showModal(`<div class="modal-head"><h2>Copy to Unit</h2><button class="icon-x" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body"><p style="font-size:13px;color:var(--ink-faint);margin:0 0 10px">Copy ${ids.size} selected item${ids.size===1?'':'s'} to:</p>${opts}</div>
  <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`);
}
function copyToUnit(sec,targetId){
  const src=getUnit();const tgt=getUnit(targetId);if(!src||!tgt)return;
  const ids=selectedRows[sec];
  const toCopy=src.items[sec].filter(r=>ids.has(String(r.id)));
  toCopy.forEach(r=>tgt.items[sec].push({...r,id:Date.now()+Math.random(),altGroup:null}));
  markDirty();
  toast(`Copied ${toCopy.length} item${toCopy.length===1?'':'s'} to "${tgt.name}"`);
  renderSidebarUnits();if(currentView==='overview')renderOverview();
}
function changeFinishSelected(sec){
  if(!selectedRows[sec].size){toast('No items selected','warn');return;}
  const unit=getUnit();if(!unit)return;
  // Only finish-based items (exclude custom, no-finish, and glass wardrobe items)
  const eligible=unit.items[sec].filter(r=>
    selectedRows[sec].has(String(r.id)) && !r.custom && r.finish!=='(No Finish)' &&
    !(sec==='wardrobe'&&WD_GLASS_CATS.has(r.category)) &&
    !(sec==='wardrobe'&&WD_NOFIN_CATS.has(r.category))
  );
  if(!eligible.length){toast('No eligible items (custom, glass, and no-finish items are skipped)','warn');return;}
  const finishSet=new Set();
  eligible.forEach(r=>{
    const dataItems=(sec==='accessories'?[]:((getPD()[sec==='kitchen'?'kitchen':'wardrobe']||{})[r.category]||[]));
    dataItems.forEach(it=>Object.keys(it.prices).forEach(k=>{
      const f=k.split('__')[0];if(f&&f!=='(No Finish)')finishSet.add(f);
    }));
  });
  const finishes=[...finishSet].sort();
  if(!finishes.length){toast('No common finishes available.','warn');return;}
  const showHandle=sec==='kitchen';
  showModal(`<div class="modal-head"><h2>Change Finish · ${eligible.length} Item${eligible.length===1?'':'s'}</h2><button class="icon-x" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
  <div class="modal-body">
    <div class="field"><label>New Finish</label><select class="select" id="bfc-finish">${finishes.map(f=>`<option>${esc(f)}</option>`).join('')}</select></div>
    ${showHandle?`<div class="field" id="bfc-handle-field"><label>Handle</label><select class="select" id="bfc-variant"><option value="standard">Standard</option><option value="gola">Gola</option></select></div>`:''}
    <p style="font-size:12px;color:var(--ink-faint);margin-top:4px">Items where the selected finish is unavailable will keep their current finish.</p>
  </div>
  <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="applyFinishChange('${sec}')">Apply</button></div>`);
}
function applyFinishChange(sec){
  const unit=getUnit();if(!unit)return;
  const newFinish=el('bfc-finish')?.value;
  const newVariant=el('bfc-variant')?.value||'standard';
  if(!newFinish){toast('Select a finish','warn');return;}
  let updated=0,skipped=0;
  unit.items[sec].forEach(r=>{
    if(!selectedRows[sec].has(String(r.id)))return;
    if(r.custom||r.finish==='(No Finish)'){skipped++;return;}
    if(sec==='wardrobe'&&(WD_GLASS_CATS.has(r.category)||WD_NOFIN_CATS.has(r.category))){skipped++;return;}
    const dataPool=sec==='kitchen'?getPD().kitchen:getPD().wardrobe;
    const catItems=(dataPool[r.category]||[]);
    const descItem=catItems.find(it=>it.desc===r.desc);
    if(!descItem){skipped++;return;}
    if(sec==='kitchen'){
      const variant=NO_HANDLE_CATS.has(r.category)?'standard':(newVariant||'standard');
      const key=newFinish+'__'+variant, stdKey=newFinish+'__standard';
      if(key in descItem.prices||stdKey in descItem.prices){
        r.finish=newFinish;r.variant=NO_HANDLE_CATS.has(r.category)?'':variant;
        r.thickness=detectThickness(newFinish);
        r.price=descItem.prices[key]||descItem.prices[stdKey]||r.price; updated++;
      } else skipped++;
    } else {
      const key=newFinish+'__standard';
      if(key in descItem.prices){
        r.finish=newFinish; r.variant='';
        if(descItem.thicknesses&&descItem.thicknesses[key]) r.thickness=descItem.thicknesses[key];
        else r.thickness=detectThickness(newFinish);
        r.price=descItem.prices[key]||r.price; updated++;
      } else skipped++;
    }
  });
  if(updated) markDirty();
  closeModal(); selectedRows[sec].clear();
  refreshTable(sec); renderSidebarUnits();
  toast(`Updated ${updated} item${updated===1?'':'s'}${skipped?`, ${skipped} skipped`:''}`, updated?'success':'warn');
}

function unitDragStart(e,id){

  const el=document.querySelector(`.sb-item[data-unit="${id}"]`);

function unitDrop(e,targetId){
  e.preventDefault();
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('drop-above','drop-below'));
  if(!dragUnit||dragUnit===targetId)return;
  const srcIdx=units.findIndex(u=>u.id===dragUnit);
  const tgtIdx=units.findIndex(u=>u.id===targetId);
  if(srcIdx<0||tgtIdx<0)return;
  const tgtEl=document.querySelector(`.sb-item[data-unit="${targetId}"]`);
  const after=tgtEl&&e.clientY>tgtEl.getBoundingClientRect().top+tgtEl.getBoundingClientRect().height/2;

  const newTgt=units.findIndex(u=>u.id===targetId);

  markDirty();
  dragUnit=null; renderSidebarUnits();

function markDirty(){ if(!dirty){ dirty=true; updateDirtyIndicator(); updateAltVerChip(); } }

function getActiveAlt(){ return alts.find(a=>a.key===activeAltKey) || alts[0]; }
function nextAltKey(){ return String.fromCharCode(65+alts.length); }

let _commit = {mode:'version', ready:false, nameError:false};
